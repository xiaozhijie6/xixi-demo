<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>西西 · 初次认识</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#FBF7F5;
  --ink:#46343E;
  --ink-2:#7A6570;
  --ink-3:#A9939E;
  --pink:#F2D7DE;
  --lav:#DFD6F2;
  --rose:#BE7E8F;
  --rose-deep:#A96678;
  --violet:#A97E9C;
  --serif:'Noto Serif SC','Songti SC','STSong',serif;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--sans);color:var(--ink);background:#F2F0EC;
  display:flex;align-items:center;justify-content:center;min-height:100vh;
}
/* 应用容器：手机满屏，桌面居中 */
.app{
  width:min(430px,100vw);height:100dvh;max-height:932px;position:relative;
  background:
    radial-gradient(600px 380px at 85% -8%,#F3E9F5 0%,transparent 60%),
    radial-gradient(500px 320px at -10% 30%,#FBEAE0 0%,transparent 55%),
    var(--bg);
  overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 30px 80px rgba(90,55,75,.18);
}
@media (max-width:480px){.app{box-shadow:none}}
/* ---- 顶部 ---- */
.top{display:flex;align-items:center;justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top)) 20px 10px;flex:none}
.back{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:.2s;visibility:hidden}
.back svg{width:18px;height:18px;stroke:var(--ink-3);stroke-width:2;fill:none}
.back:hover{background:rgba(190,126,143,.08)}
.dots{display:flex;gap:6px}
.dots span{width:26px;height:3px;border-radius:2px;background:var(--pink);opacity:.35;transition:.4s}
.dots span.on{opacity:1;background:linear-gradient(90deg,var(--rose),var(--violet))}
.skip{font-size:12.5px;color:var(--ink-3);cursor:pointer;padding:6px 8px;margin:-6px -8px;transition:.2s;min-width:34px;text-align:right}
.skip:hover{color:var(--rose-deep)}
/* ---- 步骤区 ---- */
.steps{flex:1;position:relative;overflow:hidden;padding:0 24px}
.step{position:absolute;inset:0;display:flex;flex-direction:column;
  opacity:0;visibility:hidden;transform:translateX(48px);
  transition:opacity .4s ease,transform .4s cubic-bezier(.22,1,.36,1),visibility .4s}
.step.active{opacity:1;visibility:visible;transform:none}
.step.prev{transform:translateX(-48px)}
/* 头部：徽章与标题同行，节省纵向空间 */
.head{display:flex;align-items:center;gap:14px;margin:6px 0 16px;flex:none}
.medal{width:52px;height:52px;border-radius:18px;flex:none;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,rgba(190,126,143,.14),rgba(169,126,156,.1));
  border:1px solid rgba(190,126,143,.2);box-shadow:0 6px 16px rgba(190,126,143,.14)}
.medal svg{width:26px;height:26px;stroke:var(--rose-deep);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.step.active .medal{animation:medalIn .55s cubic-bezier(.22,1.2,.36,1) both}
@keyframes medalIn{from{transform:scale(.5) rotate(-10deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.head .ht{flex:1;min-width:0}
.label{font-size:11.5px;color:var(--rose);letter-spacing:.12em;font-weight:500;margin-bottom:5px}
.title{font-family:var(--serif);font-size:21.5px;font-weight:700;line-height:1.3;color:var(--ink)}
.sub{font-size:12.5px;color:var(--ink-3);line-height:1.5;margin-bottom:14px;flex:none}
/* ---- 选项卡片 ---- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;align-content:center;flex:1}
.grid.cols1{grid-template-columns:1fr}
.card{display:flex;align-items:center;gap:9px;padding:10px 11px;min-height:50px;border-radius:15px;text-align:left;
  border:1.5px solid rgba(190,126,143,.16);background:rgba(255,255,255,.68);
  font-size:13px;line-height:1.3;color:var(--ink);cursor:pointer;position:relative;font-family:var(--sans);
  transition:border-color .2s,background .2s,box-shadow .2s,transform .12s}
.card:active{transform:scale(.95)}
.card .ic{width:30px;height:30px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;
  background:rgba(190,126,143,.1);transition:.2s}
.card .ic svg{width:16px;height:16px;stroke:var(--rose-deep);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:.2s}
.card .tx{flex:1;min-width:0}
.card .ck{position:absolute;top:-7px;right:-7px;width:19px;height:19px;border-radius:50%;
  background:linear-gradient(135deg,var(--rose),var(--violet));color:#fff;font-size:10.5px;
  display:flex;align-items:center;justify-content:center;transform:scale(0);
  transition:transform .26s cubic-bezier(.3,1.6,.5,1);box-shadow:0 3px 8px rgba(169,126,156,.4)}
.card.on{border-color:var(--rose);background:#fff;box-shadow:0 5px 16px rgba(190,126,143,.18)}
.card.on .ic{background:linear-gradient(135deg,var(--rose),var(--violet))}
.card.on .ic svg{stroke:#fff}
.card.on .ck{transform:scale(1)}
/* 继续按钮 */
.next{width:100%;height:48px;border:none;border-radius:14px;margin-top:auto;margin-bottom:4px;flex:none;
  background:linear-gradient(135deg,var(--rose),var(--violet));color:#fff;font-size:14.5px;font-weight:500;
  cursor:pointer;transition:.25s;box-shadow:0 8px 20px rgba(190,126,143,.28);font-family:var(--sans)}
.next:disabled{opacity:.35;box-shadow:none;cursor:default}
.next:not(:disabled):active{transform:scale(.97)}
/* 称呼步输入 */
.name-row{display:flex;gap:8px;margin-top:12px}
.name-row input{flex:1;min-width:0;padding:13px 16px;border-radius:14px;border:1.5px solid rgba(190,126,143,.15);
  background:rgba(255,255,255,.7);font-size:14px;color:var(--ink);outline:none;transition:.25s;font-family:var(--sans)}
.name-row input:focus{border-color:var(--pink);background:#fff}
.name-row input::placeholder{color:var(--ink-3)}
.name-row button{width:46px;height:46px;border-radius:14px;border:none;flex:none;
  background:linear-gradient(135deg,var(--rose),var(--violet));color:#fff;font-size:20px;cursor:pointer;transition:.2s}
.name-row button:active{transform:scale(.92)}
/* ---- 分步入场动画（每步不同，不统一淡入） ---- */
.step.active .anim-rise .card,.step.active .anim-rise .next,.step.active .anim-rise .name-row{animation:aRise .45s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(.08s + var(--i)*.045s)}
@keyframes aRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.step.active .anim-pop .card,.step.active .anim-pop .next{animation:aPop .45s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(.08s + var(--i)*.05s)}
@keyframes aPop{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:scale(1)}}
.step.active .anim-slide .card{animation:aSlide .45s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(.06s + var(--i)*.06s)}
@keyframes aSlide{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
.step.active .anim-flip .card{animation:aFlip .5s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(.06s + var(--i)*.05s)}
@keyframes aFlip{from{opacity:0;transform:perspective(500px) rotateX(-26deg) translateY(10px)}to{opacity:1;transform:none}}
/* ---- 汇总 ---- */
.sum{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:0 36px;opacity:0;visibility:hidden;transition:.4s}
.sum.active{opacity:1;visibility:visible}
.sum .orb{width:76px;height:76px;margin-bottom:16px;position:relative}
.sum .orb img{width:100%;height:100%;object-fit:cover;border-radius:50%;box-shadow:0 8px 26px rgba(190,126,143,.25)}
.sum .chk{position:absolute;bottom:-2px;right:-2px;width:26px;height:26px;border-radius:50%;
  background:linear-gradient(135deg,var(--rose),var(--violet));display:flex;align-items:center;justify-content:center}
.sum .chk svg{width:13px;height:13px;stroke:#fff;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sum .sl{font-size:12px;color:var(--rose);letter-spacing:.15em;margin-bottom:10px;font-weight:500}
.sum h2{font-family:var(--serif);font-size:23px;font-weight:700;margin-bottom:14px}
.sum .sd{font-size:13.5px;color:var(--ink-2);line-height:1.9;margin-bottom:18px}
.sum .sn{font-size:11px;color:var(--ink-3);background:rgba(190,126,143,.08);padding:6px 14px;border-radius:999px;margin-bottom:30px;line-height:1.6}
.sum .pri{width:100%;max-width:280px;height:50px;border:none;border-radius:14px;font-size:15px;
  background:linear-gradient(135deg,var(--rose),var(--violet));color:#fff;cursor:pointer;transition:.25s;
  box-shadow:0 8px 20px rgba(190,126,143,.28);font-family:var(--sans)}
.sum .pri:active{transform:scale(.97)}
.sum .ghost{margin-top:12px;background:none;border:none;font-size:13px;color:var(--ink-2);cursor:pointer;padding:8px;font-family:var(--sans)}
.sum .ghost:hover{color:var(--rose-deep)}
.sum.active .rise{animation:aRise .55s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i)*.12s)}
/* ---- 安全确认弹卡 ---- */
.mask{position:absolute;inset:0;background:rgba(70,52,62,.32);backdrop-filter:blur(4px);
  z-index:80;opacity:0;visibility:hidden;transition:.3s}
.mask.show{opacity:1;visibility:visible}
.safety{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%) scale(.92);z-index:90;
  background:rgba(253,250,249,.97);border-radius:24px;padding:26px 22px 20px;text-align:center;
  border:1px solid rgba(30,28,24,.08);box-shadow:0 24px 60px rgba(120,60,80,.3);
  opacity:0;visibility:hidden;transition:.35s cubic-bezier(.22,.9,.3,1.15)}
.safety.show{opacity:1;visibility:visible;transform:translateY(-50%) scale(1)}
.safety .cicon{width:54px;height:54px;border-radius:50%;margin:0 auto 14px;
  background:linear-gradient(135deg,#F0EBFA,#E0D6F2);display:flex;align-items:center;justify-content:center}
.safety .cicon svg{width:25px;height:25px;stroke:var(--rose-deep);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.safety h3{font-family:var(--serif);font-size:18px;margin-bottom:8px}
.safety p{font-size:12.5px;color:var(--ink-2);line-height:1.8;margin-bottom:6px}
.safety .hot{font-size:12px;color:var(--ink);margin-bottom:16px}
.safety .hot b{letter-spacing:.05em}
.safety .pri{width:100%;height:46px;border:none;border-radius:13px;font-size:14.5px;margin-bottom:10px;
  background:#1E1C19;color:#fff;cursor:pointer;font-family:var(--sans)}
.safety .calm{width:100%;height:42px;border-radius:13px;font-size:13px;cursor:pointer;font-family:var(--sans);
  background:#F2F0EC;border:1px solid #E5E1DA;color:var(--ink-2)}
.safety .note{font-size:10.5px;color:var(--ink-3);margin-top:12px}
/* ---- Toast ---- */
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(14px);z-index:120;
  background:rgba(60,44,54,.9);color:#fff;font-size:12.5px;padding:10px 20px;border-radius:999px;
  opacity:0;visibility:hidden;transition:.3s;white-space:nowrap}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%)}
/* 底注 */
.foot{text-align:center;font-size:11px;color:var(--ink-3);padding:10px 0 calc(12px + env(safe-area-inset-bottom));flex:none}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="back" id="back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></div>

    <div class="skip" id="skip">跳过</div>
  </header>
  <main class="steps" id="steps"></main>
  <!-- 汇总视图 -->
  <div class="sum" id="sum">
    <div class="orb rise" style="--i:0"><img src="../assets/avatar-ai.webp" alt="西西">
      <div class="chk"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg></div>

    <div class="sn rise" style="--i:4">回答仅用于更好陪伴，可随时在「我的—个人档案」修改或删除</div>
    <button class="pri rise" style="--i:5" onclick="goApp('chat')">开始第一次倾诉</button>

  </div>
  <footer class="foot" id="foot">你的回答只用于提供更合适的陪伴</footer>
  <!-- 情绪安全确认 -->
  <div class="mask" id="safetyMask"></div>
  <div class="safety" id="safetyCard">

    <h3>先确认你是安全的</h3>

    <button class="pri" onclick="safetyToConsult()">联系真人咨询师</button>

  </div>
  <div class="toast" id="toast"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const $$=(s,r=document)=>r.querySelectorAll(s);
const OB_KEY='xixi_onboard_v2';
let ob={name:'',troubles:[],prefer:[],relation:'',mood:''};
let cur=0;
/* ---- 图标库 ---- */
const ICONS={
  chat:'<path d="M4 5h16v11H9l-5 4V5z"/>',

   opts:[['单身 / 暂无稳定关系','user'],['恋爱 / 稳定交往','heart'],['已婚 / 共同生活','home'],['分居、离婚或关系变动中','split'],['情况比较复杂','shuffle'],['暂时不想说','quiet']]},
  {key:'mood',type:'single',anim:'flip',medal:'wave',
   label:'当前情绪 · 单选',title:'此刻感受更接近？',sub:'选最接近的一项即可。',
   skip:'说不清楚',
   opts:[['比较平静','calm'],['有些委屈','tear'],['焦虑不安','bolt'],['生气烦躁','fire'],['疲惫无力','battery'],['难过想哭','rain'],['感到绝望','down'],['说不清楚','fog']]},
  {key:'name',type:'name',anim:'rise',medal:'sparkle',
   label:'怎么称呼 · 可选',title:'我可以怎么叫你？',sub:'不用真名，只用于陪伴称呼。',
   skip:'暂时不设置'},
];
const ic=n=>'<svg viewBox="0 0 24 24">'+ICONS[n]+'</svg>';
/* ---- 渲染 ---- */
function render(){
  const dots=$('dots');
  STEPS.forEach(()=>dots.appendChild(document.createElement('span')));
  const wrap=$('steps');
  STEPS.forEach((st,i)=>{
    const el=document.createElement('div');
    el.className='step';el.dataset.step=i;
    let h='<div class="head"><div class="medal">'+ic(st.medal)+'</div><div class="ht">'
      +'<div class="label">'+st.label+'</div>'
      +'<h2 class="title">'+st.title+'</h2></div></div>'
      +'<p class="sub">'+st.sub+'</p>';
    if(st.type==='name'){
      h+='<div class="grid cols1 anim-'+st.anim+'">'
        +'<button class="card" id="nameQuick" style="--i:0" onclick="setName(\'小美\')"><span class="ic">'+ic('sparkle')+'</span><span class="tx">用昵称「小美」</span><span class="ck">✓</span></button>'
        +'<div class="name-row" style="--i:1"><input type="text" id="customName" placeholder="自己输入昵称" maxlength="8" onkeydown="if(event.key===\'Enter\')customName()"><button onclick="customName()">›</button></div></div>';
    }else{
      h+='<div class="grid anim-'+st.anim+(st.cols===1?' cols1':'')+'">'
        +st.opts.map((o,k)=>'<button class="card" style="--i:'+k+'" onclick="tap(this,'+i+','+k+')"><span class="ic">'+ic(o[1])+'</span><span class="tx">'+o[0]+'</span><span class="ck">✓</span></button>').join('')
        +'</div>';
      if(st.type==='multi')h+='<button class="next" id="next'+i+'" style="--i:'+st.opts.length+'" disabled onclick="go(cur+1)">继续</button>';
    }
    el.innerHTML=h;wrap.appendChild(el);
  });
}
/* ---- 步骤控制 ---- */
function go(n){
  if(n>=STEPS.length){finish();return;}
  $$('.step').forEach((s,i)=>{
    s.classList.remove('active','prev');
    if(i===n)s.classList.add('active');
    else if(i<n)s.classList.add('prev');
  });
  cur=n;
  $$('#dots span').forEach((d,i)=>d.classList.toggle('on',i===n));
  $('back').style.visibility=n>0?'visible':'hidden';
  $('skip').style.visibility='visible';
  $('skip').textContent=STEPS[n].skip||'跳过';
  $('foot').style.visibility='visible';
  $('sum').classList.remove('active');
}
$('back').onclick=()=>{if(cur>0)go(cur-1);};
$('skip').onclick=()=>{
  const st=STEPS[cur];
  if(st.type==='multi')ob[st.key]=[];
  else ob[st.key]='';
  go(cur+1);
};
/* ---- 选项 ---- */
function tap(btn,si,k){
  const st=STEPS[si],txt=st.opts[k][0];
  if(st.type==='multi'){
    const sel=ob[st.key],idx=sel.indexOf(txt);
    if(idx>=0){sel.splice(idx,1);btn.classList.remove('on');}
    else{
      if(sel.length>=st.max){toast('最多选 '+st.max+' 项，可先取消一项');return;}
      sel.push(txt);btn.classList.add('on');
    }
    const nb=$('next'+si);
    nb.disabled=sel.length===0;
    nb.textContent=sel.length?('继续 · 已选 '+sel.length+'/'+st.max):'继续';
  }else{
    ob[st.key]=txt;
    $$('.card',btn.parentElement).forEach(c=>c.classList.remove('on'));
    btn.classList.add('on');
    if(txt==='感到绝望'){setTimeout(triggerSafety,340);return;}
    setTimeout(()=>go(cur+1),320);
  }
}
/* ---- 称呼 ---- */
function setName(v){
  ob.name=v;
  const q=$('nameQuick');if(q)q.classList.add('on');
  setTimeout(finish,280);
}
function customName(){
  const v=$('customName').value.trim();
  if(!v){toast('请输入一个称呼');return;}
  ob.name=v;setTimeout(finish,200);
}
/* ---- 安全确认 ---- */
function triggerSafety(){$('safetyMask').classList.add('show');$('safetyCard').classList.add('show');}
function closeSafety(){$('safetyMask').classList.remove('show');$('safetyCard').classList.remove('show');}
function safetyContinue(){closeSafety();setTimeout(()=>go(cur+1),300);}
function safetyToConsult(){closeSafety();localStorage.setItem(OB_KEY,JSON.stringify(ob));goApp('consultants');}
/* ---- 汇总 ---- */
const TROUBLE_SHORT={'伴侣沟通不顺':'伴侣沟通','婚姻出现变化':'婚姻变化','对关系感到不安':'关系中的不安','家庭/亲子压力':'家庭和亲子压力','情绪起伏大':'情绪压力','工作生活压力':'工作生活压力','失眠、想太多':'睡眠困扰','孤独、没人理解':'孤独感','想更了解自己':'自我探索','只是想说说话':'倾诉的需要'};
const MOOD_PHRASE={'比较平静':'此刻比较平静','有些委屈':'现在有些委屈','焦虑不安':'现在有些焦虑不安','生气烦躁':'现在有点烦躁','疲惫无力':'现在很疲惫','难过想哭':'现在心里难过','感到绝望':'现在正经历很难的时刻','说不清楚':'感受还有些说不清楚'};
const PREF_PHRASE={'先听我说完':'先听你说完','帮我把事理清楚':'帮你把事理清楚','帮我看见真实感受':'陪你看见真实感受','一起想想怎么办':'陪你一起想办法','提醒我注意安全与边界':'提醒你注意安全与边界','需要时联系真人咨询师':'需要时帮你联系真人咨询师','还不确定，先聊聊':'先轻松聊聊'};
const PREF_SHORT={'帮我把事理清楚':'帮你理清'};
function finish(){
  localStorage.setItem(OB_KEY,JSON.stringify(ob));
  const name=ob.name||'你';
  const t=ob.troubles.map(x=>TROUBLE_SHORT[x]||x);
  const tTxt=t.length?('最近你主要在经历'+t.slice(0,2).join('和')+(t.length>2?'等方面的困扰':'')):'最近你想找个人说说话';
  const mTxt=ob.mood?('，'+(MOOD_PHRASE[ob.mood]||'现在有些'+ob.mood)):'';
  let pTxt='；我会先按你的节奏陪你，不急着下结论';
  if(ob.prefer.length){
    pTxt='；你希望'+(PREF_PHRASE[ob.prefer[0]]||ob.prefer[0])
      +(ob.prefer[1]?('，再'+(PREF_SHORT[ob.prefer[1]]||PREF_PHRASE[ob.prefer[1]]||ob.prefer[1])):'');
  }
  $('sumTitle').textContent=name+'，我大致了解了';
  $('sumDesc').textContent=tTxt+mTxt+pTxt+'。我们不用一次解决所有事，从你现在最想说的开始就好。';
  $$('.step').forEach(s=>s.classList.remove('active','prev'));
  $('foot').style.visibility='hidden';
  $('back').style.visibility='hidden';
  $('skip').style.visibility='hidden';
  $('sum').classList.add('active');
}
function goApp(target){
  /* 与主 Demo 衔接：跳回 index.html 对应界面 */
  location.href='index.html#'+target;
}
/* ---- Toast ---- */
let toastTimer;
function toast(msg){
  const t=$('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}
render();
go(0);
</script>
</body>
</html>
