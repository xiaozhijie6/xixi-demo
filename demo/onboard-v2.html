<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>西西 · 初次认识（杂志插图版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#FAF6F1;--ink:#46343E;--ink-2:#7A6570;--ink-3:#A9939E;
  --pink:#F2D7DE;--rose:#BE7E8F;--rose-deep:#A96678;--violet:#A97E9C;
  --serif:'Noto Serif SC','Songti SC','STSong',serif;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:#EDE9E4;display:flex;align-items:center;justify-content:center;min-height:100vh}
.app{width:min(430px,100vw);height:100dvh;max-height:932px;position:relative;background:var(--bg);
  overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(90,55,75,.2)}
@media (max-width:480px){.app{box-shadow:none}}
/* 顶部 */
.top{display:flex;align-items:center;justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top)) 20px 8px;flex:none}
.back{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;visibility:hidden}
.back svg{width:18px;height:18px;stroke:var(--ink-3);stroke-width:2;fill:none}
.back:hover{background:rgba(190,126,143,.08)}
.dots{display:flex;gap:5px}
.dots span{width:22px;height:3px;border-radius:2px;background:var(--pink);opacity:.4;transition:.4s}
.dots span.on{opacity:1;background:linear-gradient(90deg,var(--rose),var(--violet))}
.skip{font-size:12.5px;color:var(--ink-3);cursor:pointer;padding:6px 8px;margin:-6px -8px;transition:.2s}
.skip:hover{color:var(--rose-deep)}
/* 步骤区 */
.steps{flex:1;position:relative;overflow:hidden}
.step{position:absolute;inset:0;display:flex;flex-direction:column;padding:0 22px;
  opacity:0;visibility:hidden;transform:translateX(48px);
  transition:opacity .4s ease,transform .4s cubic-bezier(.22,1,.36,1),visibility .4s}
.step.active{opacity:1;visibility:visible;transform:none}
.step.prev{transform:translateX(-48px)}
/* 插图卡：Ken Burns 缓慢缩放 */
.art{height:170px;border-radius:20px;overflow:hidden;flex:none;position:relative;
  box-shadow:0 14px 34px rgba(120,80,100,.22);border:1px solid rgba(255,255,255,.8)}
.art img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.02)}
.step.active .art img{animation:kenburns 7s ease-out both}
@keyframes kenburns{from{transform:scale(1.14) translateY(8px)}to{transform:scale(1.02) translateY(0)}}
.art::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(70,45,60,.14));pointer-events:none}
.art .cap{position:absolute;left:14px;bottom:10px;z-index:2;font-size:10.5px;letter-spacing:.22em;color:rgba(255,255,255,.92);text-shadow:0 1px 6px rgba(70,45,60,.4)}
/* 标题区 */
.label{font-size:11.5px;color:var(--rose);letter-spacing:.14em;font-weight:600;margin:14px 2px 5px;flex:none}
.title{font-family:var(--serif);font-size:22px;font-weight:700;line-height:1.32;margin:0 2px 6px;flex:none}
.sub{font-size:12.5px;color:var(--ink-3);margin:0 2px 12px;flex:none}
.step.active .label,.step.active .title,.step.active .sub{animation:tIn .5s cubic-bezier(.22,1,.36,1) both}
.step.active .title{animation-delay:.06s}.step.active .sub{animation-delay:.12s}
@keyframes tIn{from{opacity:0;transform:translateY(12px);letter-spacing:.06em}to{opacity:1;transform:none;letter-spacing:0}}
/* 选项：杂志条目卡 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:center;flex:1;padding-bottom:4px}
.grid.cols1{grid-template-columns:1fr}
.card{display:flex;align-items:center;gap:8px;padding:9px 10px;min-height:46px;border-radius:13px;text-align:left;
  border:1px solid rgba(190,126,143,.2);background:rgba(255,255,255,.8);
  font-size:12.8px;line-height:1.3;color:var(--ink);cursor:pointer;position:relative;font-family:var(--sans);
  transition:border-color .2s,background .2s,box-shadow .2s,transform .12s}
.card:active{transform:scale(.95)}
.card .ic{width:27px;height:27px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(190,126,143,.1);transition:.2s}
.card .ic svg{width:15px;height:15px;stroke:var(--rose-deep);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:.2s}
.card .tx{flex:1;min-width:0}
.card .ck{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;
  background:var(--rose-deep);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;
  transform:scale(0);transition:transform .26s cubic-bezier(.3,1.6,.5,1);box-shadow:0 3px 8px rgba(169,102,120,.45)}
.card.on{border-color:var(--rose-deep);background:#fff;box-shadow:0 5px 14px rgba(190,126,143,.2)}
.card.on .ic{background:var(--rose-deep)}
.card.on .ic svg{stroke:#fff}
.card.on .ck{transform:scale(1)}
/* 入场动画：翻页式 */
.step.active .anim-book .card,.step.active .anim-book .next{animation:aBook .5s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(.15s + var(--i)*.05s)}
@keyframes aBook{from{opacity:0;transform:perspective(600px) rotateY(-18deg) translateX(20px)}to{opacity:1;transform:none}}
.step.active .anim-drop .card,.step.active .anim-drop .next{animation:aDrop .5s cubic-bezier(.3,1.3,.5,1) both;animation-delay:calc(.15s + var(--i)*.05s)}
@keyframes aDrop{from{opacity:0;transform:translateY(-16px) scale(.92)}to{opacity:1;transform:none}}
.next{width:100%;height:48px;border:none;border-radius:13px;margin-top:8px;flex:none;
  background:#46343E;color:#fff;font-size:14.5px;font-weight:500;cursor:pointer;transition:.25s;font-family:var(--sans)}
.next:disabled{opacity:.3;cursor:default}
.next:not(:disabled):active{transform:scale(.97)}
/* 称呼步 */
.name-row{display:flex;gap:8px;margin-top:10px}
.name-row input{flex:1;min-width:0;padding:13px 16px;border-radius:13px;border:1px solid rgba(190,126,143,.25);
  background:rgba(255,255,255,.8);font-size:14px;color:var(--ink);outline:none;transition:.25s;font-family:var(--sans)}
.name-row input:focus{border-color:var(--rose-deep);background:#fff}
.name-row button{width:46px;height:46px;border-radius:13px;border:none;flex:none;background:#46343E;color:#fff;font-size:20px;cursor:pointer}
/* 汇总 */
.sum{position:absolute;inset:0;display:flex;flex-direction:column;padding:0 24px;
  opacity:0;visibility:hidden;transition:.4s;overflow:hidden}
.sum.active{opacity:1;visibility:visible}
.sum .art{height:200px;margin-top:6px}
.sum .quote{font-family:var(--serif);font-size:15px;color:var(--ink-2);text-align:center;margin:16px 24px 0;line-height:1.9}
.sum h2{font-family:var(--serif);font-size:24px;font-weight:700;text-align:center;margin:14px 0 12px}
.sum .sd{font-size:13px;color:var(--ink-2);line-height:1.9;text-align:center;margin-bottom:14px}
.sum .sn{font-size:10.5px;color:var(--ink-3);text-align:center;margin-bottom:18px}
.sum .pri{width:100%;height:50px;border:none;border-radius:13px;font-size:15px;margin-top:auto;margin-bottom:10px;
  background:#46343E;color:#fff;cursor:pointer;font-family:var(--sans)}
.sum .ghost{margin:0 auto 6px;background:none;border:none;font-size:13px;color:var(--ink-2);cursor:pointer;padding:8px;font-family:var(--sans)}
.sum.active .up{animation:aDrop .55s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i)*.1s)}
/* 安全弹卡 */
.mask{position:absolute;inset:0;background:rgba(70,52,62,.32);backdrop-filter:blur(4px);z-index:80;opacity:0;visibility:hidden;transition:.3s}
.mask.show{opacity:1;visibility:visible}
.safety{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%) scale(.92);z-index:90;
  background:#FDFAF9;border-radius:22px;padding:26px 22px 20px;text-align:center;
  box-shadow:0 24px 60px rgba(120,60,80,.3);opacity:0;visibility:hidden;transition:.35s cubic-bezier(.22,.9,.3,1.15)}
.safety.show{opacity:1;visibility:visible;transform:translateY(-50%) scale(1)}
.safety .cicon{width:52px;height:52px;border-radius:50%;margin:0 auto 14px;background:linear-gradient(135deg,#F6DDE3,#EFC3CE);display:flex;align-items:center;justify-content:center}
.safety .cicon svg{width:24px;height:24px;stroke:var(--rose-deep);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.safety h3{font-family:var(--serif);font-size:18px;margin-bottom:8px}
.safety p{font-size:12.5px;color:var(--ink-2);line-height:1.8;margin-bottom:6px}
.safety .hot{font-size:12px;color:var(--rose-deep);margin-bottom:16px}
.safety .pri{width:100%;height:46px;border:none;border-radius:12px;font-size:14.5px;margin-bottom:10px;background:#46343E;color:#fff;cursor:pointer;font-family:var(--sans)}
.safety .calm{width:100%;height:42px;border-radius:12px;font-size:13px;cursor:pointer;background:#F4EFEA;border:1px solid #E5DED6;color:var(--ink-2);font-family:var(--sans)}
.safety .note{font-size:10.5px;color:var(--ink-3);margin-top:12px}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(14px);z-index:120;
  background:rgba(60,44,54,.9);color:#fff;font-size:12.5px;padding:10px 20px;border-radius:999px;
  opacity:0;visibility:hidden;transition:.3s;white-space:nowrap}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%)}
.foot{text-align:center;font-size:10.5px;color:var(--ink-3);padding:8px 0 calc(12px + env(safe-area-inset-bottom));flex:none}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="back" id="back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></div>
    <div class="dots" id="dots"></div>
    <div class="skip" id="skip">跳过</div>
  </header>
  <main class="steps" id="steps"></main>
  <div class="sum" id="sum">
    <div class="art up" style="--i:0"><img src="../assets/onboard/v2-prefer.png" alt=""><div class="cap">A NEW BEGINNING</div></div>
    <div class="quote up" style="--i:1">「被听见，本身就是一种疗愈。」</div>
    <h2 class="up" style="--i:2" id="sumTitle">我大致了解了</h2>
    <p class="sd up" style="--i:3" id="sumDesc"></p>
    <div class="sn up" style="--i:4">回答只用于陪伴你，随时可改可删</div>
    <button class="pri up" style="--i:5" onclick="goApp('chat')">开始第一次倾诉</button>
    <button class="ghost up" style="--i:6" onclick="goApp('home')">先看看西西能做什么</button>
  </div>
  <footer class="foot" id="foot">你的回答，只用来更好地陪你</footer>
  <div class="mask" id="safetyMask"></div>
  <div class="safety" id="safetyCard">
    <div class="cicon"><svg viewBox="0 0 24 24"><path d="M12 3l7 4v5c0 4.4-3 8.2-7 9-4-.8-7-4.6-7-9V7l7-4z"/><path d="M9 12l2 2 4-4"/></svg></div>
    <h3>先确认你是安全的</h3>
    <p>听到你说「感到绝望」，我很在意你此刻的状态。<br>如果正处在紧急或危险中，请直接拨打援助热线</p>
    <div class="hot">24小时心理援助热线 <b>400-161-9995</b></div>
    <button class="pri" onclick="safetyToConsult()">联系真人咨询师</button>
    <button class="calm" onclick="safetyContinue()">我暂时安全，先让西西陪我聊聊</button>
    <div class="note">你的安全比完成问卷更重要</div>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script src="js/onboard-core.js"></script>
<script>
/* v2 杂志插图风：每步一张插画卡 + 翻页/掉落动画 */
const CAPS=['WHAT\'S ON YOUR MIND','HOW I ACCOMPANY YOU','WHERE YOU ARE','HOW YOU FEEL','WHAT TO CALL YOU'];
const ANIMS=['book','book','drop','book','drop'];
function render(){
  const dots=$('dots');
  STEPS.forEach(()=>dots.appendChild(document.createElement('span')));
  const wrap=$('steps');
  STEPS.forEach((st,i)=>{
    const el=document.createElement('div');
    el.className='step';el.dataset.step=i;
    let h='<div class="art"><img src="../assets/onboard/v2-'+st.key+'.png" alt="" onerror="this.parentElement.style.background=\'linear-gradient(135deg,#F3DCC8,#E5C3B3)\';this.remove()"><div class="cap">'+CAPS[i]+'</div></div>'
      +'<div class="label">'+st.label+'</div>'
      +'<h2 class="title">'+st.title+'</h2>'
      +'<p class="sub">'+st.sub+'</p>';
    if(st.type==='name'){
      h+='<div class="grid cols1 anim-'+ANIMS[i]+'">'
        +'<button class="card" id="nameQuick" style="--i:0" onclick="setName(\'小美\')"><span class="ic">'+ic('sparkle')+'</span><span class="tx">用昵称「小美」</span><span class="ck">✓</span></button>'
        +'<div class="name-row" style="--i:1"><input type="text" id="customName" placeholder="自己输入昵称" maxlength="8" onkeydown="if(event.key===\'Enter\')customName()"><button onclick="customName()">›</button></div></div>';
    }else{
      h+='<div class="grid anim-'+ANIMS[i]+(st.cols===1?' cols1':'')+'">'
        +st.opts.map((o,k)=>'<button class="card" style="--i:'+k+'" onclick="tap(this,'+i+','+k+')"><span class="ic">'+ic(o[1])+'</span><span class="tx">'+o[0]+'</span><span class="ck">✓</span></button>').join('')
        +'</div>';
      if(st.type==='multi')h+='<button class="next" id="next'+i+'" style="--i:'+st.opts.length+'" disabled onclick="go(cur+1)">继续</button>';
    }
    el.innerHTML=h;wrap.appendChild(el);
  });
}
render();
go(0);
</script>
</body>
</html>
