<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>西西陪伴组件 · 6 版强化</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --paper:#F7F6F4; --ink:#46343E; --ink2:#7A6570; --ink3:#A9939E;
  --rose-deep:#A96678; --violet:#9B7EB8; --lav:#EDE7F6; --pink:#F2D7DE;
  --serif:'Noto Serif SC','Songti SC',serif; --sans:'Noto Sans SC','PingFang SC',sans-serif;
  --shadow:0 10px 34px rgba(178,132,152,.20);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:var(--sans);color:var(--ink);background:#EFEAE5;min-height:100vh;padding:34px 20px 60px}
h1{font-family:var(--serif);font-size:22px;text-align:center}
.sub{text-align:center;font-size:12.5px;color:var(--ink2);margin:8px 0 30px}
.grid{display:flex;flex-wrap:wrap;gap:26px;justify-content:center}
/* 每个版本的手机宽语境条 */
.ctx{width:396px;flex:none;background:radial-gradient(620px 420px at 88% -6%,#F4EAE4 0%,transparent 62%),#F7F6F4;
  border-radius:30px;padding:20px 18px 24px;box-shadow:0 20px 50px rgba(120,90,105,.14);position:relative}
.ctx .tag{position:absolute;top:-12px;left:16px;background:#fff;border-radius:999px;padding:4px 14px;
  font-size:11px;font-weight:700;color:var(--rose-deep);box-shadow:var(--shadow)}
.ctx .note{margin-top:14px;font-size:11px;color:var(--ink3);text-align:center;line-height:1.6}
/* 表情层（共用） */
.fx-stack{position:relative;flex:none}
.fx-stack img{position:absolute;inset:0;width:100%;opacity:0;transition:opacity .3s}
.fx-stack img.base{position:relative}
.fx-stack img.on{opacity:1}
.fx-stack.poke img.on{animation:pk .55s cubic-bezier(.3,1.6,.45,1)}
@keyframes pk{0%{transform:scale(1)}35%{transform:scale(.88,.84) translateY(3px)}70%{transform:scale(1.07,1.12)}100%{transform:scale(1)}}
.btxt{transition:opacity .22s}
.btxt.fade{opacity:0}

/* ============ A · 光环版：西西背后脉冲光环，气泡加粗描边 ============ */
.a .row{display:flex;align-items:center;gap:12px}
.a .orb-wrap{width:108px;position:relative}
.a .orb-wrap::before{content:'';position:absolute;inset:-12px;border-radius:50%;
  background:radial-gradient(circle,rgba(155,126,184,.4),transparent 65%);animation:halo 2.6s ease-in-out infinite}
.a .orb-wrap::after{content:'';position:absolute;inset:-4px;border-radius:50%;
  border:2px solid rgba(155,126,184,.35);animation:ringout 2.6s ease-out infinite}
@keyframes halo{0%,100%{opacity:.5;transform:scale(.92)}50%{opacity:1;transform:scale(1.06)}}
@keyframes ringout{0%{transform:scale(.85);opacity:.8}100%{transform:scale(1.35);opacity:0}}
.a .bub{flex:1;background:#fff;border:2px solid var(--lav);border-radius:20px;padding:14px 16px;
  box-shadow:var(--shadow);position:relative;cursor:pointer}
.a .bub::before{content:'';position:absolute;left:-7px;top:50%;transform:translateY(-50%) rotate(45deg);
  width:13px;height:13px;background:#fff;border-left:2px solid var(--lav);border-bottom:2px solid var(--lav);border-radius:3px}
.a .bub .btxt{font-family:var(--serif);font-size:14.5px;font-weight:700;line-height:1.6;display:block}
.a .bub .go{margin-top:6px;font-size:10.5px;color:var(--rose-deep);font-weight:700;display:flex;align-items:center;gap:4px}

/* ============ B · 描边渐变版：气泡粉紫渐变描边 ============ */
.b .row{display:flex;align-items:center;gap:12px}
.b .orb-wrap{width:100px}
.b .bub{flex:1;border-radius:20px;padding:2.5px;background:linear-gradient(120deg,#D8A7B6,#B49BE0);cursor:pointer;
  box-shadow:0 12px 30px rgba(178,132,152,.3)}
.b .bub-in{background:#fff;border-radius:18px;padding:13px 16px;position:relative}
.b .bub-in::before{content:'';position:absolute;left:-5px;top:50%;transform:translateY(-50%) rotate(45deg);
  width:12px;height:12px;background:#fff;border-radius:3px}
.b .btxt{font-size:13.5px;font-weight:700;line-height:1.6;display:block;
  background:linear-gradient(90deg,#A96678,#8D6FC0);-webkit-background-clip:text;background-clip:text;color:transparent}
.b .go{margin-top:5px;font-size:10.5px;color:var(--ink3)}

/* ============ C · 横幅版：整行渐变卡，西西探出左缘 ============ */
.c .banner{display:flex;align-items:center;border-radius:24px;padding:16px 16px 16px 6px;
  background:linear-gradient(120deg,#F4E3EA 0%,#E9E0F6 100%);box-shadow:var(--shadow);
  position:relative;overflow:visible;cursor:pointer}
.c .orb-wrap{width:92px;margin-left:-6px;margin-top:-26px;align-self:flex-start}
.c .tx{flex:1;padding-left:6px}
.c .tx .btxt{font-family:var(--serif);font-size:15.5px;font-weight:900;line-height:1.5;display:block}
.c .tx .cap{margin-top:5px;font-size:10.5px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.c .live{width:6px;height:6px;border-radius:50%;background:#B49BE0;animation:lv 1.6s infinite}
@keyframes lv{0%,100%{opacity:.4}50%{opacity:1}}
.c .arr{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.85);display:flex;
  align-items:center;justify-content:center;flex:none;box-shadow:var(--shadow)}
.c .arr svg{width:14px;height:14px;stroke:var(--rose-deep);stroke-width:2.2;fill:none}

/* ============ D · 语音版：气泡内嵌语音条 ============ */
.d .row{display:flex;align-items:center;gap:12px}
.d .orb-wrap{width:100px;position:relative}
.d .orb-wrap::after{content:'';position:absolute;inset:-6px;border-radius:50%;
  border:1.5px dashed rgba(155,126,184,.5);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.d .bub{flex:1;background:#fff;border-radius:20px;padding:12px 15px;box-shadow:var(--shadow);position:relative;cursor:pointer}
.d .bub::before{content:'';position:absolute;left:-5px;top:50%;transform:translateY(-50%) rotate(45deg);
  width:11px;height:11px;background:#fff;border-radius:3px}
.d .btxt{font-size:13px;font-weight:700;line-height:1.55;display:block}
.d .voice{display:flex;align-items:center;gap:8px;margin-top:9px}
.d .eq{display:flex;align-items:flex-end;gap:2.5px;height:14px}
.d .eq i{width:3px;border-radius:2px;background:linear-gradient(180deg,#C9A0D8,#A96678);animation:eq 1s ease-in-out infinite}
.d .eq i:nth-child(1){height:6px}.d .eq i:nth-child(2){height:12px;animation-delay:.12s}
.d .eq i:nth-child(3){height:8px;animation-delay:.24s}.d .eq i:nth-child(4){height:13px;animation-delay:.36s}
.d .eq i:nth-child(5){height:7px;animation-delay:.48s}.d .eq i:nth-child(6){height:10px;animation-delay:.6s}
@keyframes eq{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1.15)}}
.d .voice span{font-size:10px;color:var(--ink3)}
.d .mic{margin-left:auto;width:26px;height:26px;border-radius:50%;background:var(--lav);
  display:flex;align-items:center;justify-content:center}
.d .mic svg{width:12px;height:12px;stroke:var(--rose-deep);fill:none;stroke-width:1.8;stroke-linecap:round}

/* ============ E · 胶囊版：球与气泡合一 ============ */
.e .pill{display:flex;align-items:center;background:#fff;border-radius:999px;padding:8px 18px 8px 8px;
  box-shadow:0 14px 34px rgba(155,126,184,.28);border:1px solid rgba(237,231,246,.9);
  cursor:pointer;animation:bre 3.4s ease-in-out infinite}
@keyframes bre{0%,100%{box-shadow:0 14px 34px rgba(155,126,184,.28)}50%{box-shadow:0 14px 40px rgba(155,126,184,.42)}}
.e .orb-wrap{width:56px}
.e .btxt{flex:1;font-size:13px;font-weight:700;padding-left:12px;line-height:1.5;display:block}
.e .go{font-size:10px;color:var(--rose-deep);font-weight:700;flex:none}

/* ============ F · 剧场版：大西西探出卡片，气泡+快捷动作 ============ */
.f .card{position:relative;background:#fff;border-radius:26px;box-shadow:var(--shadow);
  margin-top:56px;padding:16px 16px 14px;cursor:pointer}
.f .orb-wrap{position:absolute;width:118px;top:-52px;left:50%;transform:translateX(-50%)}
.f .btxt{display:block;text-align:center;font-family:var(--serif);font-size:15px;font-weight:700;
  line-height:1.65;margin-top:66px}
.f .chips{display:flex;gap:8px;margin-top:12px}
.f .chip{flex:1;text-align:center;font-size:11px;font-weight:700;color:var(--rose-deep);
  background:#F9EDF1;border-radius:999px;padding:9px 0;cursor:pointer}
.f .chip.gh{color:var(--ink2);background:#F4F2EF}
</style>
</head>
<body>
<h1>西西陪伴组件 · 6 版强化</h1>
<p class="sub">目标：存在感更强、更像"活的"。都可点（戳西西变表情 / 气泡话术轮播），点气泡跳聊天页。</p>
<div class="grid">

  <div class="ctx a"><div class="tag">A · 光环版</div>
    <div class="row">
      <div class="orb-wrap"><div class="fx-stack" data-xixi>
        <img class="base on" src="../assets/xixi-3d.webp" alt=""><img data-x="blink" src="../assets/xixi-3d-blink.webp" alt=""><img data-x="wow" src="../assets/xixi-3d-wow.webp" alt=""><img data-x="love" src="../assets/xixi-3d-love.webp" alt="">
      </div></div>
      <div class="bub" data-go><span class="btxt"></span><span class="go">点我聊聊 ›</span></div>
    </div>
    <div class="note">脉冲光环 + 呼吸光晕，气泡 serif 加粗 + 明确引导</div>
  </div>

  <div class="ctx b"><div class="tag">B · 描边渐变版</div>
    <div class="row">
      <div class="orb-wrap"><div class="fx-stack" data-xixi>
        <img class="base on" src="../assets/xixi-3d.webp" alt=""><img data-x="blink" src="../assets/xixi-3d-blink.webp" alt=""><img data-x="wow" src="../assets/xixi-3d-wow.webp" alt=""><img data-x="love" src="../assets/xixi-3d-love.webp" alt="">
      </div></div>
      <div class="bub" data-go><div class="bub-in"><span class="btxt"></span><span class="go">西西 · 24h 倾听中</span></div></div>
    </div>
    <div class="note">粉紫渐变描边 + 渐变文字，轻而精致</div>
  </div>

  <div class="ctx c"><div class="tag">C · 横幅版</div>
    <div class="banner" data-go>
      <div class="orb-wrap"><div class="fx-stack" data-xixi>
        <img class="base on" src="../assets/xixi-3d.webp" alt=""><img data-x="blink" src="../assets/xixi-3d-blink.webp" alt=""><img data-x="wow" src="../assets/xixi-3d-wow.webp" alt=""><img data-x="love" src="../assets/xixi-3d-love.webp" alt="">
      </div></div>
      <div class="tx"><span class="btxt"></span><span class="cap"><i class="live"></i>24h 倾听中</span></div>
      <div class="arr"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div>
    </div>
    <div class="note">整行可点的渐变横幅，西西探出上缘，入口感最强</div>
  </div>

  <div class="ctx d"><div class="tag">D · 语音版</div>
    <div class="row">
      <div class="orb-wrap"><div class="fx-stack" data-xixi>
        <img class="base on" src="../assets/xixi-3d.webp" alt=""><img data-x="blink" src="../assets/xixi-3d-blink.webp" alt=""><img data-x="wow" src="../assets/xixi-3d-wow.webp" alt=""><img data-x="love" src="../assets/xixi-3d-love.webp" alt="">
      </div></div>
      <div class="bub" data-go>
        <span class="btxt"></span>
        <div class="voice">
          <span class="eq"><i></i><i></i><i></i><i></i><i></i><i></i></span>
          <span>正在听…</span>
          <span class="mic"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
        </div>
      </div>
    </div>
    <div class="note">声波虚线环 + 语音条，语音助手身份最明确</div>
  </div>

  <div class="ctx e"><div class="tag">E · 胶囊版</div>
    <div class="pill" data-go>
      <div class="orb-wrap"><div class="fx-stack" data-xixi>
        <img class="base on" src="../assets/xixi-3d.webp" alt=""><img data-x="blink" src="../assets/xixi-3d-blink.webp" alt=""><img data-x="wow" src="../assets/xixi-3d-wow.webp" alt=""><img data-x="love" src="../assets/xixi-3d-love.webp" alt="">
      </div></div>
      <span class="btxt"></span>
      <span class="go">聊聊 ›</span>
    </div>
    <div class="note">球泡合一的胶囊，呼吸阴影，适合贴底常驻</div>
  </div>

  <div class="ctx f"><div class="tag">F · 剧场版</div>
    <div class="card" data-go>
      <div class="orb-wrap"><div class="fx-stack" data-xixi>
        <img class="base on" src="../assets/xixi-3d.webp" alt=""><img data-x="blink" src="../assets/xixi-3d-blink.webp" alt=""><img data-x="wow" src="../assets/xixi-3d-wow.webp" alt=""><img data-x="love" src="../assets/xixi-3d-love.webp" alt="">
      </div></div>
      <span class="btxt"></span>
      <div class="chips"><span class="chip">开始倾诉</span><span class="chip gh">今天打卡</span></div>
    </div>
    <div class="note">大西西探出卡片 + 双快捷动作，功能入口一体化</div>
  </div>

</div>
<script>
const h=new Date().getHours();
const GREET=h<5?'夜深了':h<11?'早上好':h<14?'中午好':h<18?'下午好':'晚上好';
const BUBS=[GREET+'呀，我在呢～','今天也辛苦啦','想我了就戳戳我','心里有事？说给我听',
  '喝口水，慢慢来','我在呢，不急','今天照顾好自己了吗','风吹过来的时候，我也在'];
const POKES=['西西蹭了蹭你 ◡̈','西西绕着你转了一圈','被你戳得晃了晃','西西眨了眨眼',
  '再戳我就要飘走啦','西西听见了你的召唤','我在，一直都在'];
/* 气泡轮播（全部组件同步） */
let bi=0;
const allTxt=()=>document.querySelectorAll('.btxt');
function renderBub(){allTxt().forEach(t=>t.textContent=BUBS[bi]);}
renderBub();
setInterval(()=>{
  allTxt().forEach(t=>t.classList.add('fade'));
  setTimeout(()=>{bi=(bi+1)%BUBS.length;renderBub();allTxt().forEach(t=>t.classList.remove('fade'));},240);
},5000);
/* 表情：待机眨眼/爱心，戳戳惊讶 */
document.querySelectorAll('[data-xixi]').forEach(stack=>{
  const fxs=[...stack.querySelectorAll('img')];
  const xShow=(n,dur)=>{
    fxs.forEach(i=>i.classList.toggle('on',i.classList.contains(n)||i.dataset.x===n));
    if(dur)setTimeout(()=>xShow('base'),dur);
  };
  let n=0;
  setInterval(()=>{n++;const f=n%4===0?'love':'blink';xShow(f);setTimeout(()=>xShow('base'),f==='love'?1500:1100);},4200);
  stack.addEventListener('click',e=>{
    e.stopPropagation();
    stack.classList.remove('poke');void stack.offsetWidth;stack.classList.add('poke');
    xShow('wow',1300);
    const note=stack.closest('.ctx').querySelector('.note');
    if(note){const old=note.textContent;note.textContent=POKES[Math.floor(Math.random()*POKES.length)];
      setTimeout(()=>note.textContent=old,1800);}
  });
});
/* 跳聊天页 */
document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>{location.href='index.html#s-chat';}));
</script>
</body>
</html>
