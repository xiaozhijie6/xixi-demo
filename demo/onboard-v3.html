<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>西西 · 初次认识（贴纸版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8F0;--ink:#4A3A42;--ink-2:#8A757E;--ink-3:#B09AA4;
  --pink:#F2D7DE;--lav:#DFD6F2;--peach:#F9DCC3;
  --rose:#BE7E8F;--rose-deep:#A96678;--violet:#A97E9C;
  --serif:'Noto Serif SC','Songti SC','STSong',serif;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:#EFE7DD;display:flex;align-items:center;justify-content:center;min-height:100vh}
.app{width:min(430px,100vw);height:100dvh;max-height:932px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(90,55,75,.2);
  background:
    radial-gradient(circle at 12px 12px, rgba(190,126,143,.10) 2.2px, transparent 2.6px),
    radial-gradient(circle at 36px 36px, rgba(169,126,156,.08) 2.2px, transparent 2.6px),
    var(--bg);
  background-size:48px 48px,48px 48px,auto}
@media (max-width:480px){.app{box-shadow:none}}
/* 顶部 */
.top{display:flex;align-items:center;justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top)) 20px 6px;flex:none}
.back{width:34px;height:34px;border-radius:12px;background:#fff;border:2px solid var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;visibility:hidden;
  box-shadow:3px 3px 0 rgba(74,58,66,.9)}
.back:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(74,58,66,.9)}
.back svg{width:17px;height:17px;stroke:var(--ink);stroke-width:2.2;fill:none}
.dots{display:flex;gap:6px}
.dots span{width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:.3s}
.dots span.on{background:var(--rose-deep)}
.skip{font-size:12.5px;color:var(--ink-2);cursor:pointer;padding:5px 12px;background:#fff;
  border:2px solid var(--ink);border-radius:999px;box-shadow:3px 3px 0 rgba(74,58,66,.9);transition:.15s}
.skip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(74,58,66,.9)}
/* 步骤区 */
.steps{flex:1;position:relative;overflow:hidden}
.step{position:absolute;inset:0;display:flex;flex-direction:column;padding:0 24px;
  opacity:0;visibility:hidden;transform:translateX(60px) rotate(2deg);
  transition:opacity .4s,transform .45s cubic-bezier(.3,1.3,.4,1),visibility .4s}
.step.active{opacity:1;visibility:visible;transform:none}
.step.prev{transform:translateX(-60px) rotate(-2deg)}
/* 拍立得贴纸框 */
.polaroid{align-self:center;width:172px;background:#fff;padding:10px 10px 12px;border-radius:6px;
  border:2px solid var(--ink);box-shadow:5px 6px 0 rgba(74,58,66,.85);transform:rotate(-3deg);
  position:relative;flex:none;margin-top:2px}
.polaroid::before{content:'';position:absolute;top:-13px;left:50%;transform:translateX(-50%) rotate(4deg);
  width:74px;height:22px;background:rgba(223,214,242,.85);border:1px solid rgba(74,58,66,.15);border-radius:2px}
.polaroid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:3px;display:block}
.polaroid .pno{font-size:10px;letter-spacing:.2em;color:var(--ink-3);text-align:center;margin-top:8px;font-weight:600}
.step.active .polaroid{animation:pIn .6s cubic-bezier(.3,1.5,.45,1) both}
@keyframes pIn{from{transform:rotate(-14deg) translateY(-30px) scale(.8);opacity:0}to{transform:rotate(-3deg);opacity:1}}
/* 标题区 */
.label{display:inline-block;align-self:flex-start;font-size:11.5px;font-weight:700;color:var(--rose-deep);
  background:var(--pink);border:2px solid var(--ink);border-radius:999px;padding:3px 12px;margin:14px 0 8px;
  box-shadow:2.5px 2.5px 0 rgba(74,58,66,.9);flex:none}
.title{font-family:var(--serif);font-size:23px;font-weight:900;line-height:1.3;flex:none}
.title em{font-style:normal;background:linear-gradient(transparent 62%,var(--peach) 62%)}
.sub{font-size:12.5px;color:var(--ink-2);margin:6px 0 10px;flex:none}
.step.active .label,.step.active .title,.step.active .sub{animation:tBounce .5s cubic-bezier(.3,1.5,.45,1) both}
.step.active .title{animation-delay:.07s}.step.active .sub{animation-delay:.14s}
@keyframes tBounce{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
/* 贴纸选项 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:center;flex:1;padding-bottom:4px}
.grid.cols1{grid-template-columns:1fr}
.card{display:flex;align-items:center;gap:8px;padding:8px 10px;min-height:46px;border-radius:999px;text-align:left;
  border:2px solid var(--ink);background:#fff;box-shadow:3px 3px 0 rgba(74,58,66,.9);
  font-size:12.8px;font-weight:500;line-height:1.25;color:var(--ink);cursor:pointer;position:relative;font-family:var(--sans);
  transition:transform .12s,box-shadow .12s,background .15s}
.card:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(74,58,66,.9)}
.card .ic{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--pink);border:1.5px solid var(--ink);transition:.15s}
.card .ic svg{width:14px;height:14px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card .tx{flex:1;min-width:0}
.card .ck{position:absolute;top:-8px;right:-4px;width:20px;height:20px;border-radius:50%;
  background:#fff;border:2px solid var(--ink);color:var(--rose-deep);font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;transform:scale(0) rotate(-30deg);
  transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
.card.on{background:var(--lav)}
.card.on .ic{background:var(--rose-deep)}
.card.on .ic svg{stroke:#fff}
.card.on .ck{transform:scale(1) rotate(0)}
/* 分步动画：弹珠/洗牌/贴纸砸下 */
.step.active .anim-pinball .card,.step.active .anim-pinball .next{animation:aPinball .5s cubic-bezier(.3,1.6,.45,1) both;animation-delay:calc(.18s + var(--i)*.05s)}
@keyframes aPinball{from{opacity:0;transform:translateY(24px) scale(.7) rotate(-6deg)}to{opacity:1;transform:none}}
.step.active .anim-deal .card,.step.active .anim-deal .next{animation:aDeal .5s cubic-bezier(.3,1.4,.45,1) both;animation-delay:calc(.18s + var(--i)*.06s)}
@keyframes aDeal{from{opacity:0;transform:translateX(-40px) rotate(-8deg)}to{opacity:1;transform:none}}
.step.active .anim-stamp .card,.step.active .anim-stamp .next{animation:aStamp .45s cubic-bezier(.25,1.5,.4,1) both;animation-delay:calc(.18s + var(--i)*.05s)}
@keyframes aStamp{from{opacity:0;transform:scale(1.6)}to{opacity:1;transform:scale(1)}}
.next{width:100%;height:50px;border:2px solid var(--ink);border-radius:999px;margin-top:8px;flex:none;
  background:var(--rose-deep);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--sans);
  box-shadow:4px 4px 0 rgba(74,58,66,.9);transition:.15s}
.next:disabled{opacity:.4;cursor:default}
.next:not(:disabled):active{transform:translate(3px,3px);box-shadow:1px 1px 0 rgba(74,58,66,.9)}
/* 称呼步 */
.name-row{display:flex;gap:8px;margin-top:10px}
.name-row input{flex:1;min-width:0;padding:12px 16px;border-radius:999px;border:2px solid var(--ink);
  background:#fff;font-size:14px;color:var(--ink);outline:none;font-family:var(--sans);
  box-shadow:3px 3px 0 rgba(74,58,66,.9)}
.name-row input::placeholder{color:var(--ink-3)}
.name-row button{width:46px;height:46px;border-radius:50%;border:2px solid var(--ink);flex:none;
  background:var(--peach);color:var(--ink);font-size:20px;cursor:pointer;box-shadow:3px 3px 0 rgba(74,58,66,.9)}
.name-row button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(74,58,66,.9)}
/* 汇总 */
.sum{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:0 32px;opacity:0;visibility:hidden;transition:.4s}
.sum.active{opacity:1;visibility:visible}
.sum .polaroid{transform:rotate(2deg);width:150px;margin-bottom:18px}
.sum .sl{display:inline-block;font-size:11.5px;font-weight:700;color:var(--rose-deep);background:var(--pink);
  border:2px solid var(--ink);border-radius:999px;padding:3px 12px;margin-bottom:12px;box-shadow:2.5px 2.5px 0 rgba(74,58,66,.9)}
.sum h2{font-family:var(--serif);font-size:24px;font-weight:900;margin-bottom:12px}
.sum .sd{font-size:13px;color:var(--ink-2);line-height:1.9;margin-bottom:14px;background:#fff;
  border:2px solid var(--ink);border-radius:18px;padding:14px 16px;box-shadow:4px 4px 0 rgba(74,58,66,.9)}
.sum .sn{font-size:10.5px;color:var(--ink-3);margin-bottom:22px;line-height:1.7}
.sum .pri{width:100%;max-width:280px;height:52px;border:2px solid var(--ink);border-radius:999px;font-size:15px;font-weight:700;
  background:var(--rose-deep);color:#fff;cursor:pointer;font-family:var(--sans);box-shadow:4px 4px 0 rgba(74,58,66,.9);transition:.15s}
.sum .pri:active{transform:translate(3px,3px);box-shadow:1px 1px 0 rgba(74,58,66,.9)}
.sum .ghost{margin-top:14px;background:none;border:none;font-size:13px;color:var(--ink-2);cursor:pointer;padding:8px;font-family:var(--sans);text-decoration:underline;text-underline-offset:4px}
.sum.active .up{animation:aPinball .5s cubic-bezier(.3,1.5,.45,1) both;animation-delay:calc(var(--i)*.1s)}
/* 安全弹卡 */
.mask{position:absolute;inset:0;background:rgba(74,58,66,.4);z-index:80;opacity:0;visibility:hidden;transition:.3s}
.mask.show{opacity:1;visibility:visible}
.safety{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%) rotate(-1deg) scale(.9);z-index:90;
  background:#fff;border:2px solid var(--ink);border-radius:24px;padding:26px 22px 20px;text-align:center;
  box-shadow:6px 7px 0 rgba(74,58,66,.85);opacity:0;visibility:hidden;transition:.35s cubic-bezier(.3,1.4,.45,1)}
.safety.show{opacity:1;visibility:visible;transform:translateY(-50%) rotate(-1deg) scale(1)}
.safety .cicon{width:54px;height:54px;border-radius:50%;margin:0 auto 14px;background:var(--pink);
  border:2px solid var(--ink);display:flex;align-items:center;justify-content:center}
.safety .cicon svg{width:25px;height:25px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.safety h3{font-family:var(--serif);font-size:18px;font-weight:900;margin-bottom:8px}
.safety p{font-size:12.5px;color:var(--ink-2);line-height:1.8;margin-bottom:6px}
.safety .hot{font-size:12px;color:var(--rose-deep);font-weight:600;margin-bottom:16px}
.safety .pri{width:100%;height:46px;border:2px solid var(--ink);border-radius:999px;font-size:14.5px;font-weight:700;
  margin-bottom:10px;background:var(--ink);color:#fff;cursor:pointer;font-family:var(--sans);box-shadow:3px 3px 0 rgba(74,58,66,.4)}
.safety .calm{width:100%;height:42px;border:2px solid var(--ink);border-radius:999px;font-size:13px;cursor:pointer;
  background:#fff;color:var(--ink-2);font-family:var(--sans)}
.safety .note{font-size:10.5px;color:var(--ink-3);margin-top:12px}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:120;
  background:var(--ink);color:#fff;font-size:12.5px;padding:10px 20px;border-radius:999px;border:2px solid var(--ink);
  opacity:0;visibility:hidden;transition:.3s;white-space:nowrap}
.toast.show{opacity:1;visibility:visible}
.foot{text-align:center;font-size:10.5px;color:var(--ink-3);padding:8px 0 calc(12px + env(safe-area-inset-bottom));flex:none}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="back" id="back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></div>
    <div class="dots" id="dots"></div>
    <div class="skip" id="skip">跳过</div>
  </header>
  <main class="steps" id="steps"></main>
  <div class="sum" id="sum">
    <div class="polaroid up" style="--i:0"><img src="../assets/onboard/v3-prefer.png" alt=""><div class="pno">READY ♡</div></div>
    <div class="sl up" style="--i:1">准备好了</div>
    <h2 class="up" style="--i:2" id="sumTitle">我大致了解了</h2>
    <p class="sd up" style="--i:3" id="sumDesc"></p>
    <div class="sn up" style="--i:4">回答只用于陪伴你，随时可改可删</div>
    <button class="pri up" style="--i:5" onclick="goApp('chat')">开始第一次倾诉</button>
    <button class="ghost up" style="--i:6" onclick="goApp('home')">先看看西西能做什么</button>
  </div>
  <footer class="foot" id="foot">你的回答，只用来更好地陪你</footer>
  <div class="mask" id="safetyMask"></div>
  <div class="safety" id="safetyCard">
    <div class="cicon"><svg viewBox="0 0 24 24"><path d="M12 3l7 4v5c0 4.4-3 8.2-7 9-4-.8-7-4.6-7-9V7l7-4z"/><path d="M9 12l2 2 4-4"/></svg></div>
    <h3>先确认你是安全的</h3>
    <p>听到你说「感到绝望」，我很在意你此刻的状态。<br>如果正处在紧急或危险中，请直接拨打援助热线</p>
    <div class="hot">24小时心理援助热线 <b>400-161-9995</b></div>
    <button class="pri" onclick="safetyToConsult()">联系真人咨询师</button>
    <button class="calm" onclick="safetyContinue()">我暂时安全，先让西西陪我聊聊</button>
    <div class="note">你的安全比完成问卷更重要</div>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script src="js/onboard-core.js"></script>
<script>
/* v3 贴纸卡通风：拍立得插画 + 硬阴影贴纸按钮 */
const PNOS=['STEP 1 ♡ MOOD','STEP 2 ♡ WISH','STEP 3 ♡ STAGE','STEP 4 ♡ FEEL','STEP 5 ♡ NAME'];
const ANIMS=['pinball','deal','pinball','stamp','pinball'];
const TITLE_EM=[null,null,null,null,null];
function render(){
  const dots=$('dots');
  STEPS.forEach(()=>dots.appendChild(document.createElement('span')));
  const wrap=$('steps');
  STEPS.forEach((st,i)=>{
    const el=document.createElement('div');
    el.className='step';el.dataset.step=i;
    let h='<div class="polaroid"><img src="../assets/onboard/v3-'+st.key+'.png" alt="" onerror="this.parentElement.style.background=\'var(--lav)\';this.remove()"><div class="pno">'+PNOS[i]+'</div></div>'
      +'<div class="label">'+st.label+'</div>'
      +'<h2 class="title">'+st.title+'</h2>'
      +'<p class="sub">'+st.sub+'</p>';
    if(st.type==='name'){
      h+='<div class="grid cols1 anim-'+ANIMS[i]+'">'
        +'<button class="card" id="nameQuick" style="--i:0" onclick="setName(\'小美\')"><span class="ic">'+ic('sparkle')+'</span><span class="tx">用昵称「小美」</span><span class="ck">✓</span></button>'
        +'<div class="name-row" style="--i:1"><input type="text" id="customName" placeholder="自己输入昵称" maxlength="8" onkeydown="if(event.key===\'Enter\')customName()"><button onclick="customName()">›</button></div></div>';
    }else{
      h+='<div class="grid anim-'+ANIMS[i]+(st.cols===1?' cols1':'')+'">'
        +st.opts.map((o,k)=>'<button class="card" style="--i:'+k+'" onclick="tap(this,'+i+','+k+')"><span class="ic">'+ic(o[1])+'</span><span class="tx">'+o[0]+'</span><span class="ck">✓</span></button>').join('')
        +'</div>';
      if(st.type==='multi')h+='<button class="next" id="next'+i+'" style="--i:'+st.opts.length+'" disabled onclick="go(cur+1)">继续</button>';
    }
    el.innerHTML=h;wrap.appendChild(el);
  });
}
render();
go(0);
</script>
</body>
</html>
