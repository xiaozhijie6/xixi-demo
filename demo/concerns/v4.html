<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V4 · 十行清单 — 当前困扰</title>
<style>
:root{
  --bg:#FAF7F2; --ink:#5C4E55; --ink2:#9C8D94; --ink3:#CDBFC6;
  --rose:#C48D97; --line:#E9E1DA;
  --serif:'Noto Serif SC','Songti SC','STSong',serif;
  --num:'Bodoni MT','Didot','Noto Serif SC',serif;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--sans);background:#1d181b;display:grid;place-items:center;min-height:100vh}
.stage{width:390px;height:844px;position:relative;overflow:hidden;color:var(--ink);background:var(--bg);
  box-shadow:0 40px 90px rgba(0,0,0,.55)}
/* 水印数字 */
.wm{position:absolute;top:6px;right:-14px;font-family:var(--num);font-size:210px;line-height:1;color:transparent;
  -webkit-text-stroke:1px var(--line);z-index:0;user-select:none;pointer-events:none;font-style:italic}
/* 信封小图 */
.letter{position:absolute;top:150px;right:22px;width:74px;height:74px;z-index:3;border-radius:8px;
  background:url(../../assets/conc-letter.webp) center/cover;transform:rotate(5deg);
  box-shadow:0 8px 18px rgba(90,60,70,.22);border:4px solid #fff}
.letter::after{content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(2deg);width:34px;height:12px;
  background:rgba(200,170,150,.55)}
.sb{position:absolute;top:0;left:0;right:0;height:46px;z-index:20;display:flex;align-items:center;
  justify-content:space-between;padding:14px 24px 0;font-size:13.5px;font-weight:600}
.sb .si{display:flex;align-items:center;gap:6px}
.wrap{position:absolute;inset:0;z-index:5;padding:56px 26px 0;display:flex;flex-direction:column}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.crumbs{font-family:var(--num);font-style:italic;font-size:14px;color:var(--ink2);display:flex;gap:10px;align-items:center}
.crumbs b{font-size:20px;color:var(--ink)}
.crumbs::after{content:'';width:36px;height:1px;background:var(--ink3)}
.skip{border:none;background:none;font-size:12px;color:var(--ink2);cursor:pointer;font-family:var(--sans);
  text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--ink3)}
.kicker{font-size:10.5px;letter-spacing:.42em;color:var(--rose);font-weight:600;margin-bottom:12px}
h1{font-family:var(--serif);font-size:25px;font-weight:900;line-height:1.45;max-width:260px}
.sub{margin-top:8px;font-size:12px;color:var(--ink2)}
.rule{height:1px;background:#B9A8B0;margin:16px 0 0;transform-origin:left;animation:ruleIn .8s .5s both}
@keyframes ruleIn{from{transform:scaleX(0)}}
/* 清单 */
.list{flex:1;display:flex;flex-direction:column;justify-content:center}
.row{display:flex;align-items:center;gap:14px;height:42.5px;border-bottom:1px solid var(--line);cursor:pointer;
  position:relative;transition:background .2s;
  animation:rowIn .5s cubic-bezier(.22,.9,.32,1) both;animation-delay:calc(.55s + var(--i)*.045s)}
@keyframes rowIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.row::before{content:'';position:absolute;left:-26px;top:0;bottom:0;width:4px;background:var(--rose);transform:scaleY(0);transition:transform .25s}
.row .no{font-family:var(--num);font-style:italic;font-size:13px;color:var(--ink3);width:22px;flex:none;transition:color .2s}
.row .nm{font-size:14.5px;letter-spacing:.04em;transition:transform .2s,font-weight .2s}
.row .box{margin-left:auto;width:21px;height:21px;flex:none}
.row .box rect{fill:none;stroke:var(--ink3);stroke-width:1.4}
.row .box .tick{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:16;stroke-dashoffset:16;transition:stroke-dashoffset .3s .08s}
.row .box .fill{fill:#E3B7C2;opacity:0;transition:opacity .2s}
.row.on{background:linear-gradient(90deg,rgba(163,85,95,.07),transparent 70%)}
.row.on::before{transform:scaleY(1)}
.row.on .no{color:var(--rose)}
.row.on .nm{font-weight:600;transform:translateX(4px)}
.row.on .fill{opacity:1}
.row.on .tick{stroke-dashoffset:0}
.row.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
/* 底部 */
.foot{padding:14px 0 24px;display:flex;flex-direction:column;gap:9px}
.meta{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2);letter-spacing:.1em;margin-bottom:2px}
.meta b{font-family:var(--num);font-style:italic;font-size:13px;color:var(--rose)}
.cta{width:100%;height:52px;border:none;border-radius:2px;cursor:pointer;color:#9A7380;background:#EBDCD6;
  font-family:var(--sans);font-size:14px;font-weight:500;letter-spacing:.42em;text-indent:.42em;
  display:flex;align-items:center;justify-content:center;gap:6px;transition:opacity .25s,transform .15s,background .25s}
.cta:active{transform:scale(.98)}
.cta.dis{opacity:.35}
.note{text-align:center;font-size:10.5px;color:var(--ink3);letter-spacing:.14em}
.rise{opacity:0;animation:riseIn .6s cubic-bezier(.22,.9,.32,1) forwards}
.d1{animation-delay:.05s}.d2{animation-delay:.15s}.d3{animation-delay:.3s}.d4{animation-delay:.95s}
@keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="wm">10</div>
  <div class="letter"></div>
  <div class="sb"><span>9:41</span><div class="si">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" width="3" height="11" rx="1"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M1.5 4.5a10 10 0 0 1 13 0"/><path d="M4 7a6 6 0 0 1 8 0"/><circle cx="8" cy="9.8" r="1.1" fill="currentColor" stroke="none"/></svg>
    <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="2" fill="currentColor"/><path d="M23.5 4v4a2 2 0 0 0 0-4z" fill="currentColor" opacity=".4"/></svg>
  </div></div>
  <div class="wrap">
    <div class="head rise d1">
      <div class="crumbs"><b>02</b><span>/</span><span>04</span></div>
      <button class="skip">暂时不想说</button>
    </div>
    <div class="kicker rise d2">当前困扰 · 多选，最多 3 项</div>
    <h1 class="rise d2">最近，哪些事让你想找人说说？</h1>
    <div class="sub rise d3">选最接近的就好，之后可改。</div>
    <div class="rule"></div>
    <div class="list" id="list"></div>
    <div class="foot rise d4">
      <div class="meta"><span>CHECKED</span><span><b id="cnt">0</b> / 3</span></div>
      <button class="cta dis" id="cta">继 续</button>
      <div class="note">你的回答只用于提供更合适的陪伴</div>
    </div>
  </div>
</div>
<script>
const OPTS=['伴侣沟通不顺','婚姻出现变化','对关系感到不安','家庭/亲子压力','情绪起伏大','工作生活压力大','失眠、想太多','孤独、没人理解','想更了解自己','只是想说说话'];
const MAX=3, sel=new Set();
const list=document.getElementById('list'), cta=document.getElementById('cta'), cnt=document.getElementById('cnt');
OPTS.forEach((name,i)=>{
  const r=document.createElement('div');
  r.className='row'; r.style.setProperty('--i',i);
  r.innerHTML=`<span class="no">${String(i+1).padStart(2,'0')}</span><span class="nm">${name}</span>
  <svg class="box" viewBox="0 0 21 21"><rect class="fill" x="1" y="1" width="19" height="19" rx="3"/><rect x="1" y="1" width="19" height="19" rx="3"/><path class="tick" d="M6 10.5l3.2 3.2L15.5 7"/></svg>`;
  r.onclick=()=>{
    if(sel.has(i)){sel.delete(i);r.classList.remove('on')}
    else{
      if(sel.size>=MAX){r.classList.remove('shake');void r.offsetWidth;r.classList.add('shake');return}
      sel.add(i);r.classList.add('on');
    }
    update();
  };
  list.appendChild(r);
});
function update(){
  cnt.textContent=sel.size;
  cta.classList.toggle('dis',sel.size===0);
  cta.textContent=sel.size===0?'继 续':`继 续 · 已 选 ${sel.size}/3`;
}
cta.onclick=()=>{
  if(sel.size===0){cta.classList.remove('shake');void cta.offsetWidth;cta.classList.add('shake');return}
  cta.textContent='好 ， 都 记 下 了';
  setTimeout(update,1100);
};
update();
</script>
</body>
</html>
