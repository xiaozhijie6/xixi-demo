<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V4+ · 十行清单 · 流程版 — 五步 onboarding</title>
<style>
:root{
  --bg:#FAF7F2; --ink:#5C4E55; --ink2:#9C8D94; --ink3:#CDBFC6;
  --rose:#C48D97; --rose-soft:#E3B7C2; --gold:#C9A96E; --line:#E9E1DA;
  --serif:'Noto Serif SC','Songti SC','STSong',serif;
  --num:'Bodoni MT','Didot','Noto Serif SC',serif;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--sans);background:#241d22;display:grid;place-items:center;min-height:100vh}
.stage{width:min(430px,100vw);height:100dvh;max-height:932px;position:relative;overflow:hidden;color:var(--ink);background:var(--bg);
  box-shadow:0 40px 90px rgba(0,0,0,.55)}
@media (max-width:480px){.stage{box-shadow:none}}
/* ===== 情绪安全确认 ===== */
.safe{position:absolute;inset:0;z-index:60;display:grid;place-items:center;padding:0 26px;
  background:rgba(250,247,242,.9);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:.4s}
.safe.on{opacity:1;visibility:visible}
.scard{width:100%;max-width:320px;background:#FFFEFA;border:1px solid var(--line);border-radius:6px;
  box-shadow:0 24px 60px rgba(150,110,125,.22);padding:30px 24px 20px;text-align:center;position:relative}
.scard::before{content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(-1.5deg);width:64px;height:18px;
  background:rgba(214,178,158,.45)}
.scard .sic{width:50px;height:50px;border-radius:50%;margin:0 auto 14px;background:rgba(227,183,194,.22);
  display:flex;align-items:center;justify-content:center}
.scard .sic svg{width:24px;height:24px;stroke:var(--rose);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.scard h3{font-family:var(--serif);font-size:18px;margin-bottom:8px}
.scard p{font-size:12.5px;color:var(--ink2);line-height:1.8;margin-bottom:6px}
.scard .hot{font-size:12px;color:var(--rose);margin-bottom:16px}
.scard .hot b{letter-spacing:.05em}
.scard .sbtn{width:100%;height:46px;border:none;border-radius:2px;background:#EBDCD6;color:#9A7380;cursor:pointer;
  font-family:var(--sans);font-size:13.5px;letter-spacing:.3em;text-indent:.3em;margin-bottom:10px}
.scard .sbtn.ghost{background:none;color:var(--ink2);font-size:12.5px;letter-spacing:.1em;text-indent:.1em;
  text-decoration:underline;text-underline-offset:3px}
.scard .snote{font-size:10.5px;color:var(--ink3);margin-top:8px;letter-spacing:.12em}
/* ===== 水印大数字 ===== */
.wm{position:absolute;top:2px;right:-14px;font-family:var(--num);font-style:italic;font-size:200px;line-height:1;
  color:transparent;-webkit-text-stroke:1px var(--line);z-index:0;user-select:none;pointer-events:none}
/* ===== 状态栏 ===== */
.sb{position:absolute;top:0;left:0;right:0;height:46px;z-index:40;display:flex;align-items:center;
  justify-content:space-between;padding:14px 24px 0;font-size:13.5px;font-weight:600}
.sb .si{display:flex;align-items:center;gap:6px}
/* ===== 信封剧场 ===== */
.envwrap{position:absolute;top:150px;right:22px;z-index:25;width:86px;height:64px;
  transform:rotate(5deg);transition:top .9s cubic-bezier(.6,.05,.3,1),right .9s cubic-bezier(.6,.05,.3,1),transform .9s cubic-bezier(.6,.05,.3,1),opacity .7s}
.env{position:relative;width:86px;height:60px;border-radius:6px;perspective:340px;
  background:linear-gradient(160deg,#F7EFE4,#EEE1CF);border:1px solid #E5D8C6;
  box-shadow:0 8px 18px rgba(90,60,70,.16);animation:evSway 5.5s ease-in-out infinite}
@keyframes evSway{0%,100%{transform:rotate(0)}50%{transform:rotate(1.6deg)}}
.ev-pocket{position:absolute;left:0;right:0;top:34%;bottom:0;z-index:3;border-radius:0 0 6px 6px;
  background:
    linear-gradient(to top left,transparent 49.2%,rgba(190,160,135,.4) 49.9%,transparent 51%),
    linear-gradient(to top right,transparent 49.2%,rgba(190,160,135,.4) 49.9%,transparent 51%),
    linear-gradient(160deg,#F7EFE4,#EEE1CF)}
.ev-tape{position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(-2deg);width:34px;height:12px;
  background:rgba(214,178,158,.5);z-index:6}
.ev-letter{position:absolute;left:8%;right:8%;top:8%;height:80%;background:#FFFDF8;border:1px solid #EDE3D4;
  border-radius:2px;z-index:2;transform:translateY(10%);transition:transform .55s .12s cubic-bezier(.22,.9,.32,1);
  padding:5px 7px;display:flex;flex-direction:column;gap:3px}
.env.open .ev-letter{transform:translateY(-26%)}
.ev-letter i{display:block;height:3px;border-radius:2px;background:#E9DCD2}
.ev-letter i:nth-child(3){width:72%}
.ev-letter em{font-size:7.5px;font-style:normal;color:var(--rose);line-height:1;white-space:nowrap;
  transform:scale(.85);transform-origin:left top}
.ev-flap{position:absolute;left:0;top:0;width:100%;height:58%;z-index:4;
  clip-path:polygon(0 0,100% 0,50% 100%);background:linear-gradient(180deg,#F1E5D0,#E6D4BB);
  transform-origin:top center;transition:transform .45s ease,z-index 0s .22s}
.env.open .ev-flap{transform:rotateX(-172deg);z-index:1}
.ev-seal{position:absolute;left:50%;top:54%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#DCA6B1,#B07683);color:#FDF3F0;display:grid;place-items:center;
  font-size:10px;z-index:5;transform:scale(0);box-shadow:0 2px 5px rgba(150,90,105,.35)}
.env.sealed .ev-seal{animation:sealIn .5s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes sealIn{0%{transform:scale(2);opacity:0}55%{transform:scale(.9);opacity:1}80%{transform:scale(1.08)}100%{transform:scale(1)}}
.ev-puff{position:absolute;left:50%;top:54%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
  border:2px solid rgba(196,141,151,.6);z-index:4;opacity:0;transform:scale(.6)}
.env.sealed .ev-puff{animation:puff .55s .1s ease-out forwards}
@keyframes puff{to{opacity:0;transform:scale(2.4)}}
.env.flutter{animation:evFlut .55s}
@keyframes evFlut{20%{transform:rotate(-5deg) translateY(-4px)}45%{transform:rotate(4deg)}70%{transform:rotate(-2.5deg) translateY(0)}}
.envwrap.center{top:330px;right:50%;transform:translateX(50%) rotate(0) scale(1.55)}
.envwrap.fly{transform:translateX(50%) translateY(-860px) rotate(-16deg) scale(1.55);opacity:0;
  transition:transform 1s cubic-bezier(.5,0,.8,.4),opacity .9s}
.miniheart{position:absolute;left:50%;top:0;z-index:8;font-size:0;width:12px;height:12px;
  background:var(--rose-soft);clip-path:path('M6 11S0 7 0 3.5A3.5 3.5 0 0 1 6 2a3.5 3.5 0 0 1 6 1.5C12 7 6 11 6 11z');
  animation:heartUp 1.6s ease-out forwards}
@keyframes heartUp{0%{opacity:0;transform:translate(0,10px) scale(.4) rotate(0)}15%{opacity:1}
  100%{opacity:0;transform:translate(var(--dx),-110px) scale(1) rotate(var(--rr))}}
/* ===== 主体布局 ===== */
.wrap{position:absolute;inset:0;z-index:10;padding:56px 26px 0;display:flex;flex-direction:column}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.crumbs{font-family:var(--num);font-style:italic;font-size:14px;color:var(--ink2);display:flex;gap:10px;align-items:center}
.crumbs b{font-size:21px;color:var(--ink);display:inline-block}
.crumbs::after{content:'';width:36px;height:1px;background:var(--ink3)}
.skip{border:none;background:none;font-size:12px;color:var(--ink2);cursor:pointer;font-family:var(--sans);
  text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--ink3);transition:color .2s}
.skip:hover{color:var(--rose)}
#screen{flex:1;position:relative;min-height:0}
.page{position:absolute;inset:0;display:flex;flex-direction:column}
.kicker{font-size:10.5px;letter-spacing:.42em;color:var(--rose);font-weight:600;margin-bottom:12px}
h1{font-family:var(--serif);font-size:25px;font-weight:900;line-height:1.45;max-width:262px;min-height:72px}
.sub{margin-top:8px;font-size:12px;color:var(--ink2)}
.rule{height:1px;background:#B9A8B0;margin:14px 0 0;transform-origin:left}
.list{flex:1;display:flex;flex-direction:column;justify-content:center}
.row{display:flex;align-items:center;gap:14px;height:42.5px;border-bottom:1px solid var(--line);cursor:pointer;position:relative;transition:background .2s}
.row::before{content:'';position:absolute;left:-26px;top:0;bottom:0;width:4px;background:var(--rose);transform:scaleY(0);transition:transform .25s}
.row .no{font-family:var(--num);font-style:italic;font-size:13px;color:var(--ink3);width:22px;flex:none;transition:color .2s}
.row .nm{font-size:14.5px;letter-spacing:.04em;transition:transform .2s}
.row .box{margin-left:auto;width:21px;height:21px;flex:none}
.row .box rect{fill:none;stroke:var(--ink3);stroke-width:1.4}
.row .box .tick{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:16;stroke-dashoffset:16;transition:stroke-dashoffset .3s .08s}
.row .box .fill{fill:var(--rose-soft);opacity:0;transition:opacity .2s}
.row.on{background:linear-gradient(90deg,rgba(196,141,151,.09),transparent 70%)}
.row.on::before{transform:scaleY(1)}
.row.on .no{color:var(--rose)}
.row.on .nm{font-weight:600;transform:translateX(4px)}
.row.on .fill{opacity:1}
.row.on .tick{stroke-dashoffset:0}
.row.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
/* ===== 各步问题入场（每步不同） ===== */
/* E1 字粒升起 */
.e1 .kicker,.e1 .sub{animation:softIn .6s .1s both}
.e1 h1 .ch{display:inline-block;overflow:hidden;vertical-align:bottom}
.e1 h1 .ch i{display:inline-block;font-style:normal;transform:translateY(112%);animation:chUp .5s cubic-bezier(.22,.9,.32,1) forwards;animation-delay:calc(var(--d)*1ms)}
@keyframes chUp{to{transform:none}}
.e1 .rule{animation:ruleL .7s .5s both}
.e1 .row{animation:rowL .5s cubic-bezier(.22,.9,.32,1) both;animation-delay:calc(.55s + var(--i)*.045s)}
@keyframes rowL{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
/* E2 字距压缩 + 翻转 */
.e2 h1{animation:trackIn .8s .1s both}
@keyframes trackIn{from{opacity:0;letter-spacing:.5em;filter:blur(6px)}to{opacity:1;letter-spacing:.02em;filter:none}}
.e2 .kicker,.e2 .sub{animation:softIn .6s .15s both}
.e2 .rule{transform-origin:center;animation:ruleC .7s .45s both}
.e2 .list{perspective:760px}
.e2 .row{animation:flipUp .55s cubic-bezier(.22,.9,.32,1) both;animation-delay:calc(.5s + var(--i)*.055s)}
@keyframes flipUp{from{opacity:0;transform:rotateX(-58deg)}to{opacity:1;transform:none}}
/* E3 扫线揭示 + 切片展开 */
.e3 h1{position:relative;clip-path:inset(0 100% 0 0);animation:wipeTxt .8s .3s cubic-bezier(.6,0,.3,1) forwards}
@keyframes wipeTxt{to{clip-path:inset(0 0 0 0)}}
.e3 h1 .bar{position:absolute;top:0;bottom:0;width:46px;background:linear-gradient(90deg,transparent,rgba(196,141,151,.4),transparent);
  left:-60px;animation:barSweep .8s .3s cubic-bezier(.6,0,.3,1) forwards}
@keyframes barSweep{to{left:110%}}
.e3 .kicker,.e3 .sub{animation:softIn .6s .12s both}
.e3 .rule{transform-origin:right;animation:ruleR .7s .5s both}
.e3 .row{animation:rowClip .5s cubic-bezier(.22,.9,.32,1) both;animation-delay:calc(.55s + var(--i)*.05s)}
@keyframes rowClip{from{clip-path:inset(0 100% 0 0);opacity:.3}to{clip-path:inset(0 0 0 0);opacity:1}}
/* E4 打字机 + 弹跳 */
.e4 h1 .caret{display:inline-block;width:2px;height:.95em;background:var(--rose);vertical-align:-.12em;margin-left:2px;animation:caret .8s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.e4 .kicker,.e4 .sub{animation:softIn .6s .12s both}
.e4 .rule{animation:ruleL .7s .4s both}
.e4 .row{animation:popRow .5s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(.6s + var(--i)*.05s)}
@keyframes popRow{from{opacity:0;transform:scale(.4)}70%{transform:scale(1.04)}to{opacity:1;transform:scale(1)}}
/* E5 柔焦浮入 */
.e5 .kicker,.e5 h1,.e5 .sub{animation:focusIn .8s .15s both}
@keyframes focusIn{from{opacity:0;transform:translateY(14px);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
.e5 .rule{transform-origin:center;animation:ruleC .7s .45s both}
.e5 .namerow{animation:softIn .6s .6s both}
.e5 .chip{animation:popRow .5s cubic-bezier(.34,1.56,.64,1) .75s both}
@keyframes softIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ruleL{from{transform:scaleX(0)}}
@keyframes ruleC{from{transform:scaleX(0)}}
@keyframes ruleR{from{transform:scaleX(0)}}
/* 昵称输入 */
.namewrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding-bottom:60px}
.namerow{display:flex;align-items:flex-end;gap:12px;border-bottom:1px solid #B9A8B0;padding-bottom:10px}
.namerow input{flex:1;border:none;outline:none;background:none;font-family:var(--serif);font-size:22px;color:var(--ink);letter-spacing:.06em}
.namerow input::placeholder{color:var(--ink3);font-size:16px}
.namerow button{width:38px;height:38px;border:1px solid var(--line);background:#fff;color:var(--rose);font-size:19px;cursor:pointer;border-radius:50%}
.chip{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border:1px solid var(--line);
  background:#fff;border-radius:999px;cursor:pointer;font-size:13px;color:var(--ink2);font-family:var(--sans);transition:.2s}
.chip svg{width:15px;height:15px;stroke:var(--gold);fill:none;stroke-width:1.7}
.chip.on{border-color:var(--rose-soft);color:var(--rose);background:rgba(227,183,194,.12)}
/* ===== 底部 ===== */
.foot{padding:14px 0 24px;display:flex;flex-direction:column;gap:9px;z-index:11}
.meta{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2);letter-spacing:.14em;margin-bottom:2px}
.meta b{font-family:var(--num);font-style:italic;font-size:13px;color:var(--rose);display:inline-block}
.meta b.tickpop{animation:tp .3s}
@keyframes tp{40%{transform:scale(1.45)}}
.cta{width:100%;height:52px;border:none;border-radius:2px;cursor:pointer;color:#9A7380;background:#EBDCD6;
  font-family:var(--sans);font-size:14px;font-weight:500;letter-spacing:.42em;text-indent:.42em;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;transition:opacity .25s,transform .15s,background .3s}
.cta:not(.dis)::after{content:'';position:absolute;inset:0;
  background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%);
  transform:translateX(-120%);animation:sheen 2.8s 1s infinite}
@keyframes sheen{45%{transform:translateX(120%)}100%{transform:translateX(120%)}}
.cta:active{transform:scale(.98)}
.cta.dis{opacity:.35}
.cta.hide{display:none}
.note{text-align:center;font-size:10.5px;color:var(--ink3);letter-spacing:.14em}
/* ===== 转场层 ===== */
#fx{position:absolute;inset:0;z-index:20;pointer-events:none;overflow:hidden}
.wpx{position:absolute;top:-10%;bottom:-10%;left:0;width:70%;background:#F3E9E3;
  transform:translateX(-160%) skewX(-14deg);border-right:2px solid var(--rose-soft)}
.wpx.gold{background:rgba(201,169,110,.28);width:26%}
.blind{position:absolute;top:0;bottom:0;background:#F4EDE7;border-right:1px solid var(--line);transform:scaleY(0)}
/* ===== 完成层 ===== */
.done{position:absolute;inset:0;z-index:30;display:grid;place-items:center;opacity:0;visibility:hidden;
  background:linear-gradient(rgba(250,247,242,.86),rgba(250,246,241,.96));backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  transition:opacity .7s,visibility .7s}
.done.on{opacity:1;visibility:visible}
.dcard{position:relative;width:302px;background:#FFFEFA;border:1px solid var(--line);border-radius:6px;
  box-shadow:0 24px 60px rgba(150,110,125,.22);padding:58px 26px 24px;text-align:center;
  opacity:0}
.done.on .dcard{animation:cardUp .8s .45s cubic-bezier(.34,1.4,.64,1) both}
@keyframes cardUp{from{opacity:0;transform:translateY(70px) scale(.93)}to{opacity:1;transform:none}}
.dcard::before{content:'';position:absolute;top:-10px;left:50%;transform:translateX(-50%) rotate(-1.5deg);width:76px;height:20px;
  background:rgba(214,178,158,.45)}
.dorb{position:absolute;top:-44px;left:50%;transform:translateX(-50%);width:88px;height:88px;border-radius:50%;
  background:url(../../assets/avatar-ai.webp) center/cover;box-shadow:0 14px 30px rgba(160,90,110,.3),0 0 0 5px #FFFEFA;
  opacity:0}
.done.on .dorb{animation:orbDrop .8s .15s cubic-bezier(.34,1.5,.64,1) both,orbBob 3.4s 1.1s ease-in-out infinite}
@keyframes orbDrop{from{opacity:0;transform:translateX(-50%) translateY(-120px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes orbBob{50%{transform:translateX(-50%) translateY(-7px)}}
.dkick{font-size:10px;letter-spacing:.4em;color:var(--gold);margin-bottom:14px}
.dmsg{font-family:var(--serif);font-size:16.5px;line-height:1.9;color:var(--ink);min-height:96px}
.dmsg .caret{display:inline-block;width:2px;height:.9em;background:var(--rose);vertical-align:-.1em;margin-left:2px;animation:caret .8s steps(1) infinite}
.dtags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0 18px;min-height:22px}
.dtags i{font-style:normal;font-size:10.5px;padding:4px 10px;border-radius:999px;background:rgba(227,183,194,.16);color:#A4737F;
  opacity:0;animation:softIn .5s both;animation-delay:calc(1.5s + var(--i)*.09s)}
.dbtn{width:100%;height:48px;border:none;border-radius:2px;background:#EBDCD6;color:#9A7380;cursor:pointer;
  font-family:var(--sans);font-size:13.5px;letter-spacing:.42em;text-indent:.42em;position:relative;overflow:hidden;
  opacity:0;animation:softIn .6s 2s both;transition:transform .15s}
.dbtn::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%);
  transform:translateX(-120%);animation:sheen 3s 2.4s infinite}
.dbtn:active{transform:scale(.97)}
.dnote{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--ink3);letter-spacing:.2em}
.petal{position:absolute;top:-30px;border-radius:60% 40% 60% 40%;opacity:0;
  animation:petalFall linear infinite}
@keyframes petalFall{0%{opacity:0;transform:translateY(0) rotate(0)}8%{opacity:.9}
  100%{opacity:0;transform:translateY(920px) translateX(var(--sway)) rotate(var(--spin))}}
</style>
</head>
<body>
<div class="stage">
  <div class="wm" id="wm">01</div>
  <div class="sb"><span>9:41</span><div class="si">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" width="3" height="11" rx="1"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M1.5 4.5a10 10 0 0 1 13 0"/><path d="M4 7a6 6 0 0 1 8 0"/><circle cx="8" cy="9.8" r="1.1" fill="currentColor" stroke="none"/></svg>
    <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="2" fill="currentColor"/><path d="M23.5 4v4a2 2 0 0 0 0-4z" fill="currentColor" opacity=".4"/></svg>
  </div></div>

  <div class="envwrap" id="envWrap">
    <div class="env" id="env">
      <div class="ev-tape"></div>
      <div class="ev-letter"><em id="evNote">我在听。</em><i></i><i></i></div>
      <div class="ev-pocket"></div>
      <div class="ev-flap"></div>
      <div class="ev-puff"></div>
      <div class="ev-seal">♡</div>
    </div>
  </div>

  <div class="wrap">
    <div class="head">
      <div class="crumbs"><b id="stepNo">01</b><span>/</span><span>05</span></div>
      <button class="skip" id="skipBtn">暂时不想说</button>
    </div>
    <div id="screen"></div>
    <div class="foot">
      <div class="meta"><span id="metaLab">CHECKED</span><span><b id="cnt">0</b><span id="maxLab"> / 3</span></span></div>
      <button class="cta dis" id="cta">继 续</button>
      <div class="note">你的回答只用于提供更合适的陪伴</div>
    </div>
  </div>

  <div id="fx"></div>

  <!-- 情绪安全确认（选「感到绝望」时） -->
  <div class="safe" id="safe">
    <div class="scard">
      <div class="sic"><svg viewBox="0 0 24 24"><path d="M12 3l7 4v5c0 4.4-3 8.2-7 9-4-.8-7-4.6-7-9V7l7-4z"/><path d="M9 12l2 2 4-4"/></svg></div>
      <h3>先确认你是安全的</h3>
      <p>听到你说「感到绝望」，我很在意你此刻的状态。<br>如果正处在紧急或危险中，请直接拨打援助热线</p>
      <div class="hot">24小时心理援助热线 <b>400-161-9995</b></div>
      <button class="sbtn" id="safeConsult">联 系 真 人 咨 询 师</button>
      <button class="sbtn ghost" id="safeOk">我暂时安全，先让西西陪我聊聊</button>
      <div class="snote">你的安全比完成问卷更重要</div>
    </div>
  </div>

  <div class="done" id="done">
    <div id="petals"></div>
    <div class="dcard">
      <div class="dorb"></div>
      <div class="dkick">REPLY · 西西的回信</div>
      <div class="dmsg" id="dmsg"></div>
      <div class="dtags" id="dtags"></div>
      <button class="dbtn" id="dbtn">开 启 陪 伴</button>
    </div>
    <div class="dnote">你的回答只用于提供更合适的陪伴</div>
  </div>
</div>

<script>
/* ================= 数据 ================= */
const STEPS=[
 {type:'multi',max:3,label:'当前困扰 · 多选，最多 3 项',title:'最近，哪些事让你想找人说说？',sub:'选最接近的就好，之后可改。',
  skip:'暂时不想说',note:'我在听。',
  opts:['伴侣沟通不顺','婚姻出现变化','对关系感到不安','家庭/亲子压力','情绪起伏大','工作生活压力大','失眠、想太多','孤独、没人理解','想更了解自己','只是想说说话']},
 {type:'multi',max:2,label:'陪伴偏好 · 多选，最多 2 项',title:'你希望西西怎么陪你？',sub:'没有标准答案，我会边聊边调。',
  skip:'还不确定，先聊聊',note:'慢慢来。',
  opts:['先听我说完','帮我把事理清楚','帮我看见真实感受','一起想想怎么办','提醒我注意安全与边界','需要时联系真人咨询师','还不确定，先聊聊']},
 {type:'single',label:'关系阶段 · 单选，可跳过',title:'你目前大致处在哪个阶段？',sub:'只用来更好理解你，不会替你做关系决定。',
  skip:'暂时不想说',note:'谢谢你愿意说。',
  opts:['单身 / 暂无稳定关系','恋爱 / 稳定交往','已婚 / 共同生活','分居、离婚或关系变动中','情况比较复杂','暂时不想说']},
 {type:'single',label:'当前情绪 · 单选',title:'此刻感受更接近？',sub:'选最接近的一项即可。',
  skip:'说不清楚',note:'辛苦了。',
  opts:['比较平静','有些委屈','焦虑不安','生气烦躁','疲惫无力','难过想哭','感到绝望','说不清楚']},
 {type:'name',label:'怎么称呼 · 可选',title:'我可以怎么叫你？',sub:'不用真名，只用于陪伴称呼。',
  skip:'暂时不设置',note:'很高兴认识你。'},
];
const FXN=['wipe','blinds','zoom','peel'];   // 离开第 k 步时的转场
const ms=t=>new Promise(r=>setTimeout(r,t));
const screenEl=document.getElementById('screen'), fx=document.getElementById('fx'),
      env=document.getElementById('env'), envWrap=document.getElementById('envWrap'), evNote=document.getElementById('evNote'),
      cta=document.getElementById('cta'), cnt=document.getElementById('cnt'), maxLab=document.getElementById('maxLab'),
      metaLab=document.getElementById('metaLab'), skipBtn=document.getElementById('skipBtn'),
      stepNo=document.getElementById('stepNo'), wm=document.getElementById('wm');
let cur=0, busy=false, pageEl=null, sel=new Set(), nameVal='', twToken=0;
const answers={};

/* ================= 页面渲染 ================= */
function typewrite(el,text,speed,token){
  el.innerHTML='<span id="tw"></span><span class="caret"></span>';
  const tw=el.querySelector('#tw');let i=0;
  (function tick(){
    if(token!==twToken)return;
    if(i<text.length){tw.textContent+=text[i++];setTimeout(tick,speed)}
  })();
}
function buildPage(idx){
  const st=STEPS[idx], p=document.createElement('div');
  p.className='page e'+(idx+1);
  let titleHTML;
  if(idx===0){
    titleHTML=[...st.title].map((c,k)=>`<span class="ch"><i style="--d:${k*32}">${c}</i></span>`).join('');
  }else if(idx===2){
    titleHTML=`${st.title}<span class="bar"></span>`;
  }else titleHTML=st.title;
  let body='';
  if(st.type==='name'){
    body=`<div class="namewrap">
      <div class="namerow"><input id="nm" placeholder="写一个喜欢的称呼" maxlength="8"><button id="nmGo">›</button></div>
      <button class="chip" id="quick"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>用昵称「小美」</button>
    </div>`;
  }else{
    body=`<div class="list">`+st.opts.map((o,k)=>`
      <div class="row" style="--i:${k}" data-k="${k}">
        <span class="no">${String(k+1).padStart(2,'0')}</span><span class="nm">${o}</span>
        <svg class="box" viewBox="0 0 21 21"><rect class="fill" x="1" y="1" width="19" height="19" rx="3"/><rect x="1" y="1" width="19" height="19" rx="3"/><path class="tick" d="M6 10.5l3.2 3.2L15.5 7"/></svg>
      </div>`).join('')+`</div>`;
  }
  p.innerHTML=`<div class="kicker">${st.label}</div><h1 id="ttl">${titleHTML}</h1><div class="sub">${st.sub}</div><div class="rule"></div>${body}`;
  return p;
}
function bindPage(p,idx){
  const st=STEPS[idx];
  if(idx===3){ // 打字机标题
    const t=++twToken;
    typewrite(p.querySelector('#ttl'),st.title,85,t);
  }
  if(st.type==='name'){
    const inp=p.querySelector('#nm'), chip=p.querySelector('#quick');
    const setV=v=>{nameVal=v;refreshFoot();};
    inp.addEventListener('input',()=>{chip.classList.remove('on');setV(inp.value.trim())});
    const commit=()=>{if(inp.value.trim())setV(inp.value.trim())};
    p.querySelector('#nmGo').onclick=commit;
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')commit()});
    chip.onclick=()=>{const on=chip.classList.toggle('on');inp.value=on?'小美':'';setV(on?'小美':'');envOpen()};
    return;
  }
  p.querySelectorAll('.row').forEach(r=>{
    r.onclick=()=>{
      const k=+r.dataset.k;
      if(st.type==='single'){
        if(busy)return;
        p.querySelectorAll('.row.on').forEach(x=>x.classList.remove('on'));
        r.classList.add('on');sel=new Set([k]);answers[cur]=[st.opts[k]];
        refreshFoot();envFlutter();
        /* 选「感到绝望」→ 先安全确认，不直接进下一步 */
        if(st.opts[k]==='感到绝望'){
          busy=true;
          setTimeout(()=>{busy=false;document.getElementById('safe').classList.add('on')},520);
          return;
        }
        busy=true;setTimeout(()=>{busy=false;goNext()},620);
        return;
      }
      if(sel.has(k)){sel.delete(k);r.classList.remove('on')}
      else{
        if(sel.size>=st.max){r.classList.remove('shake');void r.offsetWidth;r.classList.add('shake');return}
        sel.add(k);r.classList.add('on');envOpen();
      }
      answers[cur]=[...sel].map(i=>st.opts[i]);
      refreshFoot();
    };
  });
}
function refreshFoot(){
  const st=STEPS[cur];
  cnt.textContent=sel.size;cnt.classList.remove('tickpop');void cnt.offsetWidth;cnt.classList.add('tickpop');
  if(st.type==='multi')cta.classList.toggle('dis',sel.size===0);
  else if(st.type==='name')cta.classList.toggle('dis',!nameVal);
}
function updateChrome(){
  const st=STEPS[cur], no='0'+(cur+1);
  stepNo.textContent=no;
  stepNo.animate([{transform:'rotateX(88deg)',opacity:.3},{transform:'none',opacity:1}],{duration:420,easing:'cubic-bezier(.22,.9,.32,1)'});
  wm.textContent=no;
  wm.animate([{opacity:0,transform:'translateY(26px)'},{opacity:1,transform:'none'}],{duration:650,easing:'ease-out'});
  skipBtn.textContent=st.skip;
  metaLab.textContent=st.type==='multi'?'CHECKED':st.type==='single'?'SINGLE CHOICE':'OPTIONAL';
  maxLab.textContent=st.type==='multi'?' / '+st.max:'';
  cnt.textContent=sel.size;
  cta.classList.toggle('hide',st.type==='single');
  cta.textContent=st.type==='name'?'开 启 陪 伴':'继 续';
  evNote.textContent=st.note;
}
/* ================= 信封 ================= */
function envOpen(){env.classList.remove('sealed');env.classList.add('open')}
function envFlutter(){env.classList.remove('flutter');void env.offsetWidth;env.classList.add('flutter');setTimeout(()=>env.classList.remove('flutter'),600)}
async function envSeal(){
  env.classList.remove('open');env.classList.add('sealed');
  await ms(520);env.classList.remove('sealed');
}
/* ================= 转场 ================= */
async function fxWipe(oldP,newP){
  const a=document.createElement('div');a.className='wpx';
  const b=document.createElement('div');b.className='wpx gold';
  fx.append(a,b);
  a.animate([{transform:'translateX(-160%) skewX(-14deg)'},{transform:'translateX(260%) skewX(-14deg)'}],{duration:900,easing:'cubic-bezier(.65,0,.35,1)',fill:'forwards'});
  b.animate([{transform:'translateX(-300%) skewX(-14deg)'},{transform:'translateX(620%) skewX(-14deg)'}],{duration:900,delay:90,easing:'cubic-bezier(.65,0,.35,1)',fill:'forwards'});
  await ms(430);screenEl.appendChild(newP);bindPage(newP,cur);oldP.style.visibility='hidden';
  await ms(560);oldP.remove();a.remove();b.remove();
}
async function fxBlinds(oldP,newP){
  const n=6,strips=[];
  for(let i=0;i<n;i++){
    const s=document.createElement('div');s.className='blind';
    s.style.left=(i*100/n)+'%';s.style.width=(100/n+0.3)+'%';
    fx.appendChild(s);strips.push(s);
  }
  strips.forEach((s,i)=>s.animate([{transform:'scaleY(0)',transformOrigin:'top'},{transform:'scaleY(1)',transformOrigin:'top'}],{duration:420,delay:i*55,easing:'cubic-bezier(.6,0,.4,1)',fill:'forwards'}));
  await ms(420+5*55+40);
  screenEl.appendChild(newP);bindPage(newP,cur);oldP.remove();
  strips.forEach((s,i)=>s.animate([{transform:'scaleY(1)',transformOrigin:'bottom'},{transform:'scaleY(0)',transformOrigin:'bottom'}],{duration:430,delay:i*55,easing:'cubic-bezier(.6,0,.4,1)',fill:'forwards'}));
  await ms(430+5*55+40);strips.forEach(s=>s.remove());
}
async function fxZoom(oldP,newP){
  screenEl.appendChild(newP);bindPage(newP,cur);
  newP.animate([{opacity:0,transform:'scale(.94)',filter:'blur(5px)'},{opacity:1,transform:'none',filter:'blur(0)'}],{duration:620,delay:120,easing:'cubic-bezier(.22,.9,.32,1)',fill:'backwards'});
  const a=oldP.animate([{opacity:1,transform:'none',filter:'blur(0)'},{opacity:0,transform:'scale(1.07)',filter:'blur(7px)'}],{duration:560,easing:'cubic-bezier(.5,0,.8,.4)',fill:'forwards'});
  await a.finished;oldP.remove();
}
async function fxPeel(oldP,newP){
  screenEl.appendChild(newP);bindPage(newP,cur);
  newP.animate([{opacity:.6},{opacity:1}],{duration:500,fill:'backwards'});
  const a=oldP.animate([
    {opacity:1,transform:'none',boxShadow:'0 0 0 rgba(90,60,70,0)'},
    {opacity:.9,transform:'translate(16%,108%) rotate(9deg)',boxShadow:'-18px -24px 40px rgba(90,60,70,.28)'},
    {opacity:0,transform:'translate(24%,130%) rotate(13deg)'}
  ],{duration:780,easing:'cubic-bezier(.45,0,.7,.4)',fill:'forwards'});
  oldP.style.zIndex=5;newP.style.zIndex=1;
  await a.finished;oldP.remove();
}
const FX={wipe:fxWipe,blinds:fxBlinds,zoom:fxZoom,peel:fxPeel};
/* ================= 流程控制 ================= */
async function goNext(){
  if(busy)return;
  if(cur>=STEPS.length-1){finish();return}
  busy=true;
  const fxName=FXN[cur], oldP=pageEl;
  cur++;sel=new Set();nameVal='';
  env.classList.remove('open');
  updateChrome();refreshFoot();
  pageEl=buildPage(cur);
  await FX[fxName](oldP,pageEl);
  pageEl.style.zIndex='';
  busy=false;
}
cta.onclick=async()=>{
  if(busy)return;
  const st=STEPS[cur];
  if(st.type==='multi'&&sel.size===0){cta.classList.remove('shake');void cta.offsetWidth;cta.classList.add('shake');return}
  if(st.type==='name'&&!nameVal){cta.classList.remove('shake');void cta.offsetWidth;cta.classList.add('shake');return}
  if(st.type==='multi'){const p=envSeal();await ms(120);goNext();await p}
  else goNext();
};
skipBtn.onclick=()=>{if(!busy){envFlutter();goNext()}};
/* ================= 完成 ================= */
async function finish(){
  if(busy)return;busy=true;
  answers[4]=nameVal?[nameVal]:['（未设置）'];
  evNote.textContent='收到啦。';env.classList.add('open');
  // 当前页上飘离场
  const wrap=document.querySelector('.wrap');
  wrap.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateY(-46px)'}],{duration:600,easing:'cubic-bezier(.5,0,.8,.4)',fill:'forwards'});
  await ms(300);
  // 信封居中
  envWrap.classList.add('center');await ms(950);
  // 开出三颗纸心
  for(let k=0;k<3;k++){
    const h=document.createElement('i');h.className='miniheart';
    h.style.setProperty('--dx',(k-1)*46+'px');h.style.setProperty('--rr',(k-1)*26+'deg');
    h.style.animationDelay=(k*.18)+'s';env.appendChild(h);setTimeout(()=>h.remove(),2200);
  }
  await ms(1000);
  envWrap.classList.add('fly');await ms(820);
  // 回信层
  const done=document.getElementById('done');done.classList.add('on');
  spawnPetals();
  const t=++twToken;
  setTimeout(()=>typewrite(document.getElementById('dmsg'),'好，我都记住了。往后的日子，我会照着你说的，慢慢陪你。',95,t),650);
  // 摘要标签
  const picks=[];
  STEPS.forEach((st,i)=>{(answers[i]||[]).slice(0,2).forEach(x=>picks.push(x))});
  document.getElementById('dtags').innerHTML=picks.slice(0,7).map((x,i)=>`<i style="--i:${i}">${x}</i>`).join('');
  document.getElementById('dbtn').onclick=e=>{
    const b=e.currentTarget;
    /* 嵌入主 Demo：通知父页面完成问卷 */
    if(window.parent&&window.parent!==window){
      b.textContent='正 在 进 入 …';
      parent.postMessage({type:'onboard-done',name:answers[4]&&answers[4][0]!=='（未设置）'?answers[4][0]:'',answers},'*');
      return;
    }
    b.textContent='明 天 见 ♡';
    b.animate([{transform:'scale(1)'},{transform:'scale(.94)'},{transform:'scale(1)'}],{duration:320});
  };
}
/* ================= 安全确认 ================= */
document.getElementById('safeConsult').onclick=()=>{
  if(window.parent&&window.parent!==window){
    parent.postMessage({type:'onboard-consult',answers},'*');
  }
  document.getElementById('safe').classList.remove('on');
};
document.getElementById('safeOk').onclick=()=>{
  document.getElementById('safe').classList.remove('on');
  setTimeout(()=>goNext(),260);
};
function spawnPetals(){
  const box=document.getElementById('petals'), colors=['#F2CFD9','#F6E3C6','#E9DFEE','#FBEEDD','#EBDCD6'];
  for(let i=0;i<16;i++){
    const p=document.createElement('i');p.className='petal';
    const s=(7+Math.random()*9).toFixed(0);
    p.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s*.72}px;background:${colors[i%colors.length]};
      --sway:${(Math.random()*90-45).toFixed(0)}px;--spin:${(Math.random()*520+180).toFixed(0)}deg;
      animation-duration:${(Math.random()*5+6).toFixed(1)}s;animation-delay:${(Math.random()*5).toFixed(1)}s`;
    box.appendChild(p);
  }
}
/* ================= 启动 ================= */
updateChrome();refreshFoot();
pageEl=buildPage(0);screenEl.appendChild(pageEl);bindPage(pageEl,0);
</script>
</body>
</html>
