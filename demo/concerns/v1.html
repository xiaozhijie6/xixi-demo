<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V1 · 纸上真心话 — 当前困扰</title>
<style>
:root{
  --paper:#F7F1E8; --ink:#5B4A52; --ink2:#97848D; --ink3:#C4B2BB;
  --rose:#D99CA9; --rose-deep:#B07683; --pink:#F0D3DB; --peach:#F6DEC4;
  --serif:'Noto Serif SC','Songti SC','STSong',serif;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--sans);background:#241b20;display:grid;place-items:center;min-height:100vh;
}
.stage{
  width:390px;height:844px;position:relative;overflow:hidden;color:var(--ink);
  background:var(--paper) url(../../assets/conc-paper.webp) center/cover no-repeat;
  box-shadow:0 40px 90px rgba(0,0,0,.5);
}
/* 颗粒 + 暗角 */
.stage::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:1;
  background-image:radial-gradient(rgba(120,80,95,.05) 1px,transparent 1px);background-size:5px 5px;mix-blend-mode:multiply}
.stage::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(120% 90% at 50% 40%,transparent 62%,rgba(120,75,90,.14))}
/* 竖排装饰字 */
.vline{position:absolute;right:10px;top:238px;z-index:2;writing-mode:vertical-rl;
  font-family:var(--serif);font-size:12px;letter-spacing:.5em;color:var(--ink3)}
/* 和纸胶带 */
.tape{position:absolute;z-index:2;width:92px;height:24px;opacity:.85;
  background:repeating-linear-gradient(45deg,rgba(214,151,166,.55) 0 8px,rgba(226,178,191,.55) 8px 16px);
  box-shadow:0 2px 6px rgba(120,70,85,.18);border-left:2px dashed rgba(255,255,255,.6);border-right:2px dashed rgba(255,255,255,.6)}
.tape.t1{top:118px;left:-22px;transform:rotate(-38deg)}
.tape.t2{bottom:126px;right:-24px;transform:rotate(-42deg);background:repeating-linear-gradient(45deg,rgba(201,169,110,.5) 0 8px,rgba(222,196,152,.5) 8px 16px)}
/* 邮票 */
.stamp{position:absolute;top:112px;right:22px;z-index:3;width:58px;height:58px;border-radius:50%;
  border:1.5px dashed rgba(176,118,131,.45);display:grid;place-items:center;transform:rotate(10deg);
  font-family:var(--serif);font-size:10px;letter-spacing:.15em;color:var(--rose-deep);background:rgba(255,255,255,.45)}
.stamp b{font-size:13px;letter-spacing:.05em}
/* 干花剪贴 */
.botanic{position:absolute;left:-14px;bottom:136px;z-index:2;width:122px;height:122px;border-radius:18px;
  background:url(../../assets/conc-botanic.webp) center/cover;transform:rotate(-7deg);
  box-shadow:0 10px 22px rgba(120,75,90,.25);border:5px solid #fff;opacity:.95}
.sb{position:absolute;top:0;left:0;right:0;height:46px;z-index:20;display:flex;align-items:center;
  justify-content:space-between;padding:14px 24px 0;font-size:13.5px;font-weight:600}
.sb .si{display:flex;align-items:center;gap:6px}
.wrap{position:absolute;inset:0;z-index:5;padding:58px 26px 0;display:flex;flex-direction:column}
/* 头部 */
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.step{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink2);display:flex;align-items:baseline;gap:8px}
.step b{font-size:22px;color:var(--rose-deep);font-style:normal}
.pips{display:flex;gap:5px}
.pips i{width:14px;height:14px;border-radius:4px;background:#fff;border:1.5px solid var(--pink);transform:rotate(45deg) scale(.62)}
.pips i.done{background:var(--rose);border-color:var(--rose)}
.pips i.now{background:var(--pink);border-color:var(--rose);animation:pipPulse 1.6s infinite}
@keyframes pipPulse{50%{transform:rotate(45deg) scale(.78)}}
.skip{border:none;background:none;font-family:var(--sans);font-size:12.5px;color:var(--ink2);cursor:pointer;
  border-bottom:1px dashed var(--ink3);padding-bottom:1px}
.kicker{font-size:11px;letter-spacing:.32em;color:var(--rose);font-weight:600;margin-bottom:10px}
h1{font-family:var(--serif);font-size:29px;font-weight:900;line-height:1.42;letter-spacing:.01em}
h1 .hl{position:relative;white-space:nowrap;z-index:1}
h1 .hl::after{content:'';position:absolute;left:-4px;right:-4px;bottom:3px;height:.5em;z-index:-1;
  background:linear-gradient(90deg,rgba(240,211,219,.9),rgba(246,222,196,.9));transform:skew(-8deg)}
.sub{margin-top:8px;font-size:12.5px;color:var(--ink2)}
.sub em{font-style:normal;border-bottom:2px solid var(--pink)}
/* 选项云 */
.cloud{flex:1;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:11px 10px;padding:16px 2px}
.opt{position:relative;display:inline-flex;align-items:center;gap:7px;border:none;cursor:pointer;
  font-family:var(--sans);font-size:13.5px;color:var(--ink);padding:10px 15px;border-radius:6px 14px 6px 14px;
  background:#fff;box-shadow:0 4px 12px rgba(140,90,105,.16),0 1px 0 rgba(255,255,255,.9) inset;
  transition:transform .22s cubic-bezier(.34,1.56,.64,1),background .22s,color .22s,box-shadow .22s;
  animation:noteIn .55s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(.35s + var(--i)*.055s)}
.opt:nth-child(odd){transform:rotate(-1.8deg)}
.opt:nth-child(even){transform:rotate(1.6deg)}
.opt:nth-child(3n){border-radius:14px 6px 14px 6px}
@keyframes noteIn{from{opacity:0;transform:scale(.5) rotate(6deg)}to{opacity:1}}
.opt svg{width:16px;height:16px;stroke:var(--rose);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;transition:.22s}
.opt::after{content:'';position:absolute;top:-6px;left:50%;width:26px;height:10px;transform:translateX(-50%) rotate(-3deg);
  background:rgba(240,211,219,.8);opacity:0;transition:.2s}
.opt:hover{transform:scale(1.05)}
.opt.on{background:#F2CFD9;color:#A45E6E;transform:rotate(0deg) scale(1.06);box-shadow:0 8px 18px rgba(190,140,155,.3)}
.opt.on svg{stroke:#A45E6E}
.opt.on::after{opacity:1}
.opt .ck{position:absolute;top:-7px;right:-7px;width:19px;height:19px;border-radius:50%;background:#DFA3B1;color:#fff;
  font-size:11px;display:grid;place-items:center;opacity:0;transform:scale(0)}
.opt.on .ck{animation:ckIn .3s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes ckIn{to{opacity:1;transform:scale(1)}}
.opt.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
/* 底部 */
.foot{padding:6px 0 26px;display:flex;flex-direction:column;gap:10px;align-items:center}
.cta{width:100%;height:54px;border:none;border-radius:14px;cursor:pointer;position:relative;overflow:hidden;
  font-family:var(--serif);font-size:16.5px;font-weight:700;letter-spacing:.12em;color:#A45E6E;
  background:linear-gradient(135deg,#F2CFD9,#E8B9C6);box-shadow:0 10px 24px rgba(200,140,160,.3);
  transition:transform .18s,filter .25s,opacity .25s;display:flex;align-items:center;justify-content:center;gap:8px}
.cta::before{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);
  transform:translateX(-120%);animation:sheen 3.2s 1.4s infinite}
@keyframes sheen{40%{transform:translateX(120%)}100%{transform:translateX(120%)}}
.cta:active{transform:scale(.97)}
.cta.dis{filter:grayscale(.5);opacity:.55}
.note{font-size:11px;color:var(--ink3);letter-spacing:.06em}
.note i{font-style:normal;color:var(--rose)}
.rise{opacity:0;animation:riseIn .6s cubic-bezier(.22,.9,.32,1) forwards}
.d1{animation-delay:.05s}.d2{animation-delay:.14s}.d3{animation-delay:.24s}.d4{animation-delay:.6s}
@keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="tape t1"></div><div class="tape t2"></div>
  <div class="stamp">STEP<br><b>02</b></div>
  <div class="vline">说说话，就会好一点</div>
  <div class="botanic"></div>
  <div class="sb"><span>9:41</span><div class="si">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" width="3" height="11" rx="1"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M1.5 4.5a10 10 0 0 1 13 0"/><path d="M4 7a6 6 0 0 1 8 0"/><circle cx="8" cy="9.8" r="1.1" fill="currentColor" stroke="none"/></svg>
    <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="2" fill="currentColor"/><path d="M23.5 4v4a2 2 0 0 0 0-4z" fill="currentColor" opacity=".4"/></svg>
  </div></div>
  <div class="wrap">
    <div class="head rise d1">
      <div class="step"><b>02</b><span>/ 04</span>
        <span class="pips" style="margin-left:8px"><i class="done"></i><i class="now"></i><i></i><i></i></span>
      </div>
      <button class="skip">暂时不想说</button>
    </div>
    <div class="kicker rise d2">当前困扰 · 多选，最多 3 项</div>
    <h1 class="rise d2">最近，哪些事<br>让你想<span class="hl">找人说说</span>？</h1>
    <div class="sub rise d3">选<em>最接近的</em>就好，之后可改。</div>
    <div class="cloud" id="cloud"></div>
    <div class="foot rise d4">
      <button class="cta dis" id="cta"><span id="ctaTxt">继续 · 已选 0/3</span><span>→</span></button>
      <div class="note"><i>♡</i> 你的回答只用于提供更合适的陪伴</div>
    </div>
  </div>
</div>
<script>
const OPTS=[
 ['伴侣沟通不顺','M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z'],
 ['婚姻出现变化','M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8zM12 5.6l-1.6 4 3 2.5-1.9 4.4'],
 ['对关系感到不安','M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'],
 ['家庭/亲子压力','M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z'],
 ['情绪起伏大','M2 9c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0M2 15c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0'],
 ['工作生活压力大','M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2zM16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2'],
 ['失眠、想太多','M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z'],
 ['孤独、没人理解','M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2'],
 ['想更了解自己','M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM16.2 7.8l-2.1 6.3-6.3 2.1 2.1-6.3z'],
 ['只是想说说话','M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4zM6 2v2M10 2v2M14 2v2'],
];
const MAX=3, sel=new Set();
const cloud=document.getElementById('cloud'), cta=document.getElementById('cta'), ctaTxt=document.getElementById('ctaTxt');
OPTS.forEach(([name,d],i)=>{
  const b=document.createElement('button');
  b.className='opt'; b.style.setProperty('--i',i);
  b.innerHTML=`<svg viewBox="0 0 24 24"><path d="${d}"/></svg><span>${name}</span><span class="ck">✓</span>`;
  b.onclick=()=>{
    if(sel.has(i)){sel.delete(i);b.classList.remove('on')}
    else{
      if(sel.size>=MAX){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');return}
      sel.add(i);b.classList.add('on');
    }
    update();
  };
  cloud.appendChild(b);
});
function update(){
  ctaTxt.textContent=`继续 · 已选 ${sel.size}/${MAX}`;
  cta.classList.toggle('dis',sel.size===0);
}
cta.onclick=()=>{
  if(sel.size===0){cta.classList.remove('shake');void cta.offsetWidth;cta.classList.add('shake');return}
  ctaTxt.textContent='好，都记下了 ♡';
  setTimeout(update,1100);
};
update();
</script>
</body>
</html>
