<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V6 · 奶油便当 — 当前困扰</title>
<style>
:root{
  --cream:#FDF6EE; --ink:#6B555F; --ink2:#A48B97; --rose:#DFA3B1; --rose-deep:#C98CA0; --terra:#DFAE85;
  --serif:'Noto Serif SC','Songti SC','STSong',serif;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--sans);background:#241a20;display:grid;place-items:center;min-height:100vh}
.stage{width:390px;height:844px;position:relative;overflow:hidden;color:var(--ink);background:var(--cream);
  box-shadow:0 40px 90px rgba(0,0,0,.5)}
/* 奶油色斑点 */
.blob{position:absolute;border-radius:50%;filter:blur(38px);opacity:.55;z-index:0}
.b1{width:190px;height:190px;background:#F8CFDA;top:-60px;left:-50px}
.b2{width:160px;height:160px;background:#FBE3C2;top:220px;right:-60px}
.b3{width:150px;height:150px;background:#DCE9D8;bottom:-40px;left:-40px}
/* 旋转虚线环 */
.dial{position:absolute;top:66px;right:16px;width:66px;height:66px;z-index:2;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dial text{font-size:8.5px;letter-spacing:.28em;fill:var(--rose);font-family:var(--sans)}
.sb{position:absolute;top:0;left:0;right:0;height:46px;z-index:20;display:flex;align-items:center;
  justify-content:space-between;padding:14px 24px 0;font-size:13.5px;font-weight:600}
.sb .si{display:flex;align-items:center;gap:6px}
.wrap{position:absolute;inset:0;z-index:5;padding:54px 20px 0;display:flex;flex-direction:column}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-right:76px}
.prog{display:flex;align-items:center;gap:6px}
.prog i{width:16px;height:8px;border-radius:5px;background:#F2E2D8}
.prog i.done{background:var(--rose)}
.prog i.now{background:var(--terra);animation:wob 1.4s infinite}
@keyframes wob{50%{transform:scaleY(1.5)}}
.prog span{font-size:11px;color:var(--ink2);margin-left:5px;letter-spacing:.12em}
.skip{border:1.5px solid #EFD9CE;background:#fff;color:var(--ink2);font-size:12px;padding:6px 13px;
  border-radius:999px;cursor:pointer;font-family:var(--sans);box-shadow:0 3px 0 #EFD9CE}
.skip:active{transform:translateY(2px);box-shadow:none}
.kicker{font-size:10.5px;letter-spacing:.3em;color:var(--terra);font-weight:700;margin-bottom:8px}
h1{font-family:var(--serif);font-size:24.5px;font-weight:900;line-height:1.42}
h1 .u{position:relative;white-space:nowrap}
h1 .u::after{content:'';position:absolute;left:0;right:0;bottom:1px;height:9px;z-index:-1;border-radius:6px;
  background:repeating-linear-gradient(-45deg,#F8CFDA 0 6px,#FBE3C2 6px 12px)}
.sub{margin-top:7px;font-size:12px;color:var(--ink2)}
/* 便当格 */
.bento{flex:1;min-height:0;display:grid;gap:9px;padding:14px 0 12px;
  grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(6,1fr);
  grid-template-areas:"a a b b" "a a c c" "d d e e" "f f g g" "h h i i" "j j j j"}
.tile{position:relative;border:none;cursor:pointer;border-radius:20px;overflow:hidden;text-align:left;
  display:flex;flex-direction:column;justify-content:center;gap:4px;padding:10px 13px;color:var(--ink);
  font-family:var(--sans);
  box-shadow:0 5px 12px rgba(150,95,105,.14),inset 0 2px 0 rgba(255,255,255,.85);
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s,background .25s,color .25s;
  animation:wigIn .6s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(.3s + var(--i)*.055s)}
@keyframes wigIn{from{opacity:0;transform:scale(.4) rotate(var(--wr,6deg))}to{opacity:1;transform:none}}
.tile svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile .nm{font-size:13px;font-weight:500;letter-spacing:.02em}
.tile:active{transform:scale(.95)}
.tile.on{transform:rotate(-1.5deg) scale(1.02);box-shadow:0 8px 18px rgba(180,125,140,.26)}
.tile .ck{position:absolute;top:7px;right:7px;width:19px;height:19px;border-radius:50%;background:#fff;color:var(--rose-deep);
  font-size:11px;font-weight:700;display:grid;place-items:center;opacity:0;transform:scale(0)}
.tile.on .ck{animation:ck .3s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes ck{to{opacity:1;transform:scale(1)}}
.tile.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
/* 特色图砖 */
.tile.pic{background-size:cover;background-position:center;color:#fff;justify-content:flex-end}
.tile.pic::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(80,50,60,.05) 40%,rgba(80,45,58,.55))}
.tile.pic>*{position:relative;z-index:1}
.tile.pic .nm{font-size:14.5px;font-weight:700;text-shadow:0 1px 6px rgba(80,40,55,.5)}
.tile.pic.on{outline:3px solid #DFA3B1;outline-offset:-3px}
/* 底色轮换 */
.p0{background:#FCE4EA}.p1{background:#FCEEDD}.p2{background:#E9F1E4}.p3{background:#F1EAF8}
.p0.on{background:#F2CDD8;color:#A45E6E}
.p1.on{background:#F4DDC3;color:#9A6B3F}
.p2.on{background:#D3E2CC;color:#5F7D5B}
.p3.on{background:#E3D9F1;color:#7D68A0}
/* 底部 */
.foot{padding:2px 0 22px;display:flex;flex-direction:column;gap:9px;align-items:center}
.cta{width:100%;height:54px;border:none;border-radius:20px;cursor:pointer;color:#A45266;
  font-family:var(--serif);font-size:16px;font-weight:900;letter-spacing:.12em;
  background:linear-gradient(135deg,#F0CBD6,#E4B4C2);
  box-shadow:0 5px 0 #DDA9B8,0 12px 22px rgba(201,140,160,.3);
  display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,box-shadow .12s,opacity .25s,filter .25s}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 #DDA9B8,0 4px 10px rgba(201,140,160,.25)}
.cta.dis{filter:grayscale(.6);opacity:.5}
.note{font-size:10.5px;color:var(--ink2);letter-spacing:.1em}
.note i{font-style:normal;color:var(--rose)}
.rise{opacity:0;animation:riseIn .55s cubic-bezier(.22,.9,.32,1) forwards}
.d1{animation-delay:.05s}.d2{animation-delay:.15s}.d3{animation-delay:.8s}
@keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <svg class="dial" viewBox="0 0 66 66">
    <defs><path id="cir" d="M33,33 m-25,0 a25,25 0 1,1 50,0 a25,25 0 1,1 -50,0"/></defs>
    <text><textPath href="#cir">STEP 02 · TROUBLES · STEP 02 ·</textPath></text>
    <circle cx="33" cy="33" r="3.5" fill="#C96A7F"/>
  </svg>
  <div class="sb"><span>9:41</span><div class="si">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" width="3" height="11" rx="1"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M1.5 4.5a10 10 0 0 1 13 0"/><path d="M4 7a6 6 0 0 1 8 0"/><circle cx="8" cy="9.8" r="1.1" fill="currentColor" stroke="none"/></svg>
    <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="2" fill="currentColor"/><path d="M23.5 4v4a2 2 0 0 0 0-4z" fill="currentColor" opacity=".4"/></svg>
  </div></div>
  <div class="wrap">
    <div class="head rise d1">
      <div class="prog"><i class="done"></i><i class="now"></i><i></i><i></i><span>02 / 04</span></div>
      <button class="skip">暂时不想说</button>
    </div>
    <div class="kicker rise d2">当前困扰 · 多选，最多 3 项</div>
    <h1 class="rise d2">最近，哪些事<br>让你想<span class="u">找人说说</span>？</h1>
    <div class="sub rise d2">选最接近的就好，之后可改。</div>
    <div class="bento" id="bento"></div>
    <div class="foot rise d3">
      <button class="cta dis" id="cta"><span id="ctaTxt">继续 · 已选 0/3</span><span>→</span></button>
      <div class="note"><i>♡</i> 你的回答只用于提供更合适的陪伴</div>
    </div>
  </div>
</div>
<script>
const ICONS={
 chat:'M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z',
 broken:'M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8zM12 5.6l-1.6 4 3 2.5-1.9 4.4',
 shield:'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z',
 home:'M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
 wave:'M2 9c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0M2 15c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0',
 work:'M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2zM16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2',
 moon:'M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z',
 user:'M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2',
 compass:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM16.2 7.8l-2.1 6.3-6.3 2.1 2.1-6.3z',
 coffee:'M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4zM6 2v2M10 2v2M14 2v2',
};
// [名称, 图标, 区域, 底色类, 图片(可选)]
const TILES=[
 ['失眠、想太多','moon','a','pic','../../assets/conc-spot-moon.webp'],
 ['伴侣沟通不顺','chat','b','p0'],
 ['婚姻出现变化','broken','c','p1'],
 ['对关系感到不安','shield','d','p2'],
 ['家庭/亲子压力','home','e','p3'],
 ['情绪起伏大','wave','f','p1'],
 ['工作生活压力大','work','g','p0'],
 ['孤独、没人理解','user','h','p3'],
 ['想更了解自己','compass','i','p2'],
 ['只是想说说话','coffee','j','pic','../../assets/conc-spot-tea.webp'],
];
const MAX=3, sel=new Set();
const bento=document.getElementById('bento'), cta=document.getElementById('cta'), ctaTxt=document.getElementById('ctaTxt');
TILES.forEach(([name,ic,area,pc,img],i)=>{
  const t=document.createElement('button');
  t.className=`tile ${pc}`; t.style.setProperty('--i',i);
  t.style.setProperty('--wr',(i%2?-7:7)+'deg');
  t.style.gridArea=area;
  if(img) t.style.backgroundImage=`url(${img})`;
  t.innerHTML=`<svg viewBox="0 0 24 24"><path d="${ICONS[ic]}"/></svg><span class="nm">${name}</span><span class="ck">✓</span>`;
  t.onclick=()=>{
    if(sel.has(i)){sel.delete(i);t.classList.remove('on')}
    else{
      if(sel.size>=MAX){t.classList.remove('shake');void t.offsetWidth;t.classList.add('shake');return}
      sel.add(i);t.classList.add('on');
    }
    update();
  };
  bento.appendChild(t);
});
function update(){
  ctaTxt.textContent=`继续 · 已选 ${sel.size}/${MAX}`;
  cta.classList.toggle('dis',sel.size===0);
}
cta.onclick=()=>{
  if(sel.size===0){cta.classList.remove('shake');void cta.offsetWidth;cta.classList.add('shake');return}
  ctaTxt.textContent='好，装盒带走 ♡';
  setTimeout(update,1100);
};
update();
</script>
</body>
</html>
