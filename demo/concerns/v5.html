<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V5 · 心事气泡 — 当前困扰</title>
<style>
:root{
  --ink:#7A5B66; --ink2:#A98A96; --rose:#DCA0B0; --rose-deep:#C98CA0; --peach:#F5C9A0;
  --serif:'Noto Serif SC','Songti SC','STSong',serif;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--sans);background:#2a1e26;display:grid;place-items:center;min-height:100vh}
.stage{width:390px;height:844px;position:relative;overflow:hidden;color:var(--ink);
  background:#FBEFEA url(../../assets/conc-sky.webp) center/cover no-repeat;
  box-shadow:0 40px 90px rgba(0,0,0,.5)}
/* 漂浮云朵 */
.cloudpuff{position:absolute;z-index:1;background:rgba(255,255,255,.75);border-radius:999px;filter:blur(2px);
  animation:drift linear infinite}
.cloudpuff::before,.cloudpuff::after{content:'';position:absolute;background:inherit;border-radius:50%}
.cloudpuff::before{width:55%;height:150%;left:12%;top:-75%}
.cloudpuff::after{width:38%;height:110%;right:14%;top:-50%}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(530px)}}
.sb{position:absolute;top:0;left:0;right:0;height:46px;z-index:20;display:flex;align-items:center;
  justify-content:space-between;padding:14px 24px 0;font-size:13.5px;font-weight:600}
.sb .si{display:flex;align-items:center;gap:6px}
.wrap{position:absolute;inset:0;z-index:5;padding:52px 20px 0;display:flex;flex-direction:column}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.prog{display:flex;align-items:center;gap:7px}
.prog i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.8);border:1.5px solid #F0BFCB}
.prog i.done{background:var(--rose);border-color:var(--rose)}
.prog i.now{background:#FBD9E0;border-color:var(--rose);animation:bob 1.6s infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.prog span{font-size:11px;color:var(--ink2);margin-left:4px;letter-spacing:.15em}
.skip{border:none;background:rgba(255,255,255,.65);backdrop-filter:blur(6px);color:var(--ink2);
  font-size:12px;padding:6px 13px;border-radius:999px;cursor:pointer;font-family:var(--sans);
  border:1px solid rgba(255,255,255,.9)}
.ttl{text-align:center}
.kicker{font-size:10.5px;letter-spacing:.34em;color:var(--rose);font-weight:600;margin-bottom:8px}
h1{font-family:var(--serif);font-size:24px;font-weight:900;line-height:1.4}
h1 em{font-style:normal;background:linear-gradient(120deg,var(--rose),var(--peach));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:6px;font-size:12px;color:var(--ink2)}
/* 气泡场 */
.field{flex:1;position:relative;margin:6px auto 0;width:350px}
.bub{position:absolute;border-radius:50%;border:none;cursor:pointer;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.98),rgba(255,255,255,.72));
  box-shadow:0 8px 20px rgba(190,120,140,.22),inset 0 0 0 1.5px rgba(255,255,255,.95),inset -6px -8px 14px rgba(230,170,190,.25);
  font-family:var(--sans);padding:8px;
  animation:popIn .6s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(.3s + var(--i)*.06s)}
.bub .in{display:flex;flex-direction:column;align-items:center;gap:3px;animation:idle var(--fd,4s) ease-in-out infinite;animation-delay:calc(.3s + var(--i)*.06s + .6s)}
@keyframes popIn{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.bub svg{width:19px;height:19px;stroke:var(--rose);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bub .t{font-size:11.5px;line-height:1.3;letter-spacing:.02em;max-width:86px}
.bub::after{content:'';position:absolute;left:20%;top:13%;width:22%;height:13%;border-radius:50%;
  background:rgba(255,255,255,.9);filter:blur(2px);transform:rotate(-24deg)}
.bub.on{background:radial-gradient(circle at 32% 28%,#F9DEE5,#F2C6D3 55%,#ECB7C7);color:#B06076;
  box-shadow:0 12px 26px rgba(201,140,160,.4),inset 0 0 0 2px rgba(255,255,255,.75)}
.bub.on svg{stroke:#B06076}
.bub.on::after{opacity:.5}
.bub .ring{position:absolute;inset:-5px;border-radius:50%;border:2px solid rgba(220,160,176,.55);opacity:0;transform:scale(.8)}
.bub.on .ring{animation:ringPulse 1.8s .2s infinite}
@keyframes ringPulse{0%{opacity:.8;transform:scale(.92)}70%{opacity:0;transform:scale(1.14)}100%{opacity:0}}
.bub.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
/* 选中碎光 */
.spark{position:absolute;z-index:9;width:6px;height:6px;border-radius:50%;pointer-events:none;
  animation:sparkOut .65s cubic-bezier(.16,.84,.44,1) forwards}
@keyframes sparkOut{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}
/* 收集槽 */
.slots{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0 12px}
.slots .lab{font-size:11.5px;color:var(--ink2);letter-spacing:.12em;margin-right:2px}
.slot{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.7);border:1.5px dashed #E5A9B9;
  display:grid;place-items:center;transition:.3s}
.slot svg{width:12px;height:12px;fill:var(--rose);opacity:0;transform:scale(0)}
.slot.full{border-style:solid;border-color:var(--rose);background:#fff;box-shadow:0 3px 8px rgba(188,85,112,.3)}
.slot.full svg{animation:heartIn .35s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes heartIn{to{opacity:1;transform:scale(1)}}
.foot{padding:2px 0 24px;display:flex;flex-direction:column;gap:9px;align-items:center}
.cta{width:100%;height:54px;border:none;border-radius:999px;cursor:pointer;color:#B06076;
  font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.12em;
  background:linear-gradient(120deg,#F2C9D4,#F6DCC4);box-shadow:0 12px 26px rgba(220,160,176,.4);
  display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .18s,opacity .25s,filter .25s}
.cta:active{transform:scale(.97)}
.cta.dis{filter:grayscale(.5);opacity:.55}
.note{font-size:10.5px;color:var(--ink2);letter-spacing:.1em;opacity:.85}
.note i{font-style:normal;color:var(--rose)}
.rise{opacity:0;animation:riseIn .6s cubic-bezier(.22,.9,.32,1) forwards}
.d1{animation-delay:.05s}.d2{animation-delay:.16s}.d3{animation-delay:.85s}
@keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="cloudpuff" style="width:70px;height:22px;top:120px;animation-duration:34s"></div>
  <div class="cloudpuff" style="width:52px;height:16px;top:210px;animation-duration:26s;animation-delay:-12s"></div>
  <div class="cloudpuff" style="width:88px;height:26px;top:60px;animation-duration:44s;animation-delay:-25s"></div>
  <div class="sb"><span>9:41</span><div class="si">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" width="3" height="11" rx="1"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M1.5 4.5a10 10 0 0 1 13 0"/><path d="M4 7a6 6 0 0 1 8 0"/><circle cx="8" cy="9.8" r="1.1" fill="currentColor" stroke="none"/></svg>
    <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="2" fill="currentColor"/><path d="M23.5 4v4a2 2 0 0 0 0-4z" fill="currentColor" opacity=".4"/></svg>
  </div></div>
  <div class="wrap">
    <div class="head rise d1">
      <div class="prog"><i class="done"></i><i class="now"></i><i></i><i></i><span>02 / 04</span></div>
      <button class="skip">暂时不想说</button>
    </div>
    <div class="ttl rise d2">
      <div class="kicker">当前困扰 · 多选，最多 3 项</div>
      <h1>戳破那颗<em>最像你的</em>心事泡泡</h1>
      <div class="sub">最近，哪些事让你想找人说说？选最接近的就好。</div>
    </div>
    <div class="field" id="field"></div>
    <div class="slots rise d3">
      <span class="lab">收集心事</span>
      <span class="slot"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.9-9.8-9A5.4 5.4 0 0 1 12 6.2 5.4 5.4 0 0 1 21.8 12c-2.3 4.1-9.8 9-9.8 9z"/></svg></span>
      <span class="slot"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.9-9.8-9A5.4 5.4 0 0 1 12 6.2 5.4 5.4 0 0 1 21.8 12c-2.3 4.1-9.8 9-9.8 9z"/></svg></span>
      <span class="slot"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.9-9.8-9A5.4 5.4 0 0 1 12 6.2 5.4 5.4 0 0 1 21.8 12c-2.3 4.1-9.8 9-9.8 9z"/></svg></span>
      <span class="lab" id="cnt">0/3</span>
    </div>
    <div class="foot rise d3">
      <button class="cta dis" id="cta"><span id="ctaTxt">继续 · 已选 0/3</span><span>→</span></button>
      <div class="note"><i>♡</i> 你的回答只用于提供更合适的陪伴</div>
    </div>
  </div>
</div>
<script>
const OPTS=[
 ['伴侣沟通不顺','M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z'],
 ['婚姻出现变化','M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8zM12 5.6l-1.6 4 3 2.5-1.9 4.4'],
 ['对关系感到不安','M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'],
 ['家庭/亲子压力','M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z'],
 ['情绪起伏大','M2 9c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0M2 15c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0'],
 ['工作生活压力大','M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2zM16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2'],
 ['失眠、想太多','M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z'],
 ['孤独、没人理解','M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2'],
 ['想更了解自己','M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM16.2 7.8l-2.1 6.3-6.3 2.1 2.1-6.3z'],
 ['只是想说说话','M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4zM6 2v2M10 2v2M14 2v2'],
];
// [x, y, 直径, 漂浮时长]
const POS=[
 [0,6,106,4.2],[124,0,98,3.6],[242,10,108,4.8],
 [8,124,100,4.5],[128,134,94,3.8],[244,124,100,4.1],
 [0,242,104,3.7],[122,252,100,4.6],[240,242,104,3.9],
 [123,360,104,4.3],
];
const MAX=3, sel=new Set();
const field=document.getElementById('field'), cta=document.getElementById('cta'),
      ctaTxt=document.getElementById('ctaTxt'), cnt=document.getElementById('cnt'),
      slots=[...document.querySelectorAll('.slot')];
const COLORS=['#F5C9A0','#DCA0B0','#F2D7DE','#E8B7C4','#F9DCC3','#C98CA0'];
OPTS.forEach(([name,d],i)=>{
  const [x,y,s,fd]=POS[i];
  const b=document.createElement('button');
  b.className='bub'; b.style.setProperty('--i',i);
  b.style.cssText=`left:${x}px;top:${y}px;width:${s}px;height:${s}px;--fd:${fd}s`;
  b.innerHTML=`<span class="ring"></span><span class="in"><svg viewBox="0 0 24 24"><path d="${d}"/></svg><span class="t">${name}</span></span>`;
  b.onclick=()=>{
    if(sel.has(i)){sel.delete(i);b.classList.remove('on')}
    else{
      if(sel.size>=MAX){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');return}
      sel.add(i);b.classList.add('on');burst(b);
    }
    update();
  };
  field.appendChild(b);
});
function burst(b){
  const fr=field.getBoundingClientRect(), br=b.getBoundingClientRect();
  const cx=br.left-fr.left+br.width/2, cy=br.top-fr.top+br.height/2;
  for(let k=0;k<8;k++){
    const s=document.createElement('i');s.className='spark';
    const a=k/8*Math.PI*2, dist=44+Math.random()*22;
    s.style.cssText=`left:${cx-3}px;top:${cy-3}px;background:${COLORS[k%COLORS.length]};
      --dx:${Math.cos(a)*dist}px;--dy:${Math.sin(a)*dist}px`;
    field.appendChild(s);setTimeout(()=>s.remove(),700);
  }
}
function update(){
  ctaTxt.textContent=`继续 · 已选 ${sel.size}/${MAX}`;
  cnt.textContent=`${sel.size}/${MAX}`;
  cta.classList.toggle('dis',sel.size===0);
  slots.forEach((s,k)=>s.classList.toggle('full',k<sel.size));
}
cta.onclick=()=>{
  if(sel.size===0){cta.classList.remove('shake');void cta.offsetWidth;cta.classList.add('shake');return}
  ctaTxt.textContent='好，都收进口袋了 ♡';
  setTimeout(update,1100);
};
update();
</script>
</body>
</html>
